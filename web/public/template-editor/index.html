<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор шаблона</title>
<!-- Локальные шрифты (web/public/template-editor/fonts.css + fonts/*.woff2, см.
     src/scripts/fetch-template-fonts.mjs). Без Google CDN → редактор работает офлайн. -->
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="editor.css?v=20260630-minimal">
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <div class="brand" data-i18n="brand">Редактор шаблона</div>
    </div>

    <div class="top-actions">
      <input id="tplName" class="tpl-name" placeholder="Название шаблона" data-i18n-placeholder="templateName" value="untitled">
      <button data-action="new" data-i18n-title="newTitle" title="Новый чистый шаблон">
        <span data-i18n="newTemplate">Новый</span>
      </button>
      <button data-action="import" data-i18n-title="importTitle" title="Загрузить JSON">
        <span data-i18n="import">Импорт</span>
      </button>
      <button data-action="export" class="primary" data-i18n-title="exportTitle" title="Скачать JSON">
        <span data-i18n="export">Скачать JSON</span>
      </button>
      <input type="file" id="importInput" accept=".json,application/json" hidden>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel tools" id="toolsPanel">
      <div class="panel-head">
        <span data-i18n="toolsTitle">Блоки</span>
      </div>
      <div class="tool-stack">
        <button class="tool-btn primary" data-action="add-killbox" data-i18n-title="addFieldTitle" title="Добавить поле текста">
          <span class="tool-ic">T</span>
          <span>
            <b data-i18n="addField">Поле текста</b>
            <small data-i18n="addFieldSub">для данных карточки</small>
          </span>
        </button>
        <button class="tool-btn" data-action="add-text" data-i18n-title="addTextTitle" title="Добавить обычную надпись">
          <span class="tool-ic">Aa</span>
          <span>
            <b data-i18n="addText">Надпись</b>
            <small data-i18n="addTextSub">статичный текст</small>
          </span>
        </button>
        <label class="tool-btn file-btn" data-i18n-title="addImageTitle" title="Загрузить картинку">
          <span class="tool-ic">▧</span>
          <span>
            <b data-i18n="addImage">Картинка</b>
            <small data-i18n="addImageSub">SVG, PNG или JPG</small>
          </span>
          <input type="file" id="imageInput" accept=".svg,.png,.jpg,.jpeg,image/*" hidden>
        </label>
      </div>

      <div class="panel-section">
        <div class="section-title" data-i18n="viewTitle">Вид</div>
        <label class="chk"><input type="checkbox" id="snapToggle" checked> <span data-i18n="snap">Привязка к сетке</span></label>
        <label class="chk"><input type="checkbox" id="guidesToggle" checked> <span data-i18n="guides">Показывать поля</span></label>
      </div>

      <div class="panel-section">
        <div class="section-title" data-i18n="zoomTitle">Масштаб</div>
        <div class="zoom-group">
          <button data-action="zoom-out" data-i18n-title="zoomOutTitle" title="Уменьшить">−</button>
          <button data-action="zoom-pct" id="zoomBtn" data-i18n-title="zoomResetTitle" title="100%">100%</button>
          <button data-action="zoom-in" data-i18n-title="zoomInTitle" title="Увеличить">＋</button>
          <button data-action="zoom-fit" data-i18n-title="zoomFitTitle" title="Вписать" data-i18n="zoomFit">Вписать</button>
        </div>
      </div>

      <div class="panel-section layers-inline">
        <div class="section-title" data-i18n="layersTitle">Слои</div>
        <ul id="layers"></ul>
        <div class="small muted" data-i18n="layersHint">Перетащите слой выше или ниже, чтобы изменить порядок.</div>
      </div>

      <div class="panel-foot small" data-i18n="toolsHint">Начните с поля текста: оно станет переменной карточки в паке.</div>
    </aside>

    <!-- ЦЕНТР: ХОЛСТ -->
    <section class="stage-wrap" id="stageWrap">
      <div class="stage-sizer" id="stageSizer">
        <div class="stage" id="stage">
          <div class="canvas" id="canvas">
            <!-- сюда монтируются элементы -->
          </div>
        </div>
      </div>
      <div class="stage-info">
        <span id="canvasInfo">1080 × 1920</span>
        <span class="dot">·</span>
        <span><span data-i18n="zoomLabel">масштаб</span>: <span id="zoomVal">—</span></span>
      </div>
    </section>

    <!-- ПРАВАЯ ПАНЕЛЬ: СВОЙСТВА -->
    <aside class="panel props" id="propsPanel">
      <div class="panel-head">
        <span data-i18n="propsTitle">Настройки</span>
      </div>
      <div id="props" class="props-body">
        <div class="empty" data-i18n="emptyProps">Выберите блок на холсте, чтобы настроить текст, размер и лимиты.</div>
      </div>
    </aside>

  </main>

  <script src="editor.js?v=20260630-minimal"></script>
</body>
</html>
