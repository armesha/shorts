<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<title>Power Run</title>
	<style>
		:root { color-scheme: only light; background: #0d76db; }
		* { box-sizing: border-box; }
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			touch-action: none;
		}
		body {
			display: grid;
			place-items: center;
			background:
				radial-gradient(circle at 14% 22%, rgba(255, 212, 59, .32), transparent 18%),
				radial-gradient(circle at 86% 78%, rgba(255, 91, 61, .34), transparent 21%),
				linear-gradient(145deg, #126be0 0%, #19bce5 50%, #115ed1 100%);
		}
		#game-frame {
			position: relative;
			overflow: hidden;
			background: #20bcd9;
			box-shadow: 0 22px 70px rgba(4, 40, 94, .42);
			isolation: isolate;
		}
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			outline: 0;
			image-rendering: auto;
		}
		#status {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			background: #149ee8;
			font: 600 14px/1.4 system-ui, sans-serif;
			color: #17354d;
		}
		#status-splash {
			grid-area: 1 / 1;
			max-width: 100%;
			max-height: 100%;
			object-fit: contain;
		}
		#status-splash.show-image--false { display: none; }
		#status-splash.fullsize--true { width: 100%; height: 100%; }
		#status-progress {
			grid-area: 1 / 1;
			align-self: end;
			width: 44%;
			margin-bottom: 9%;
			accent-color: #1676ed;
		}
		#status-notice {
			grid-area: 1 / 1;
			display: none;
			max-width: 80%;
			padding: 16px 18px;
			border-radius: 18px;
			background: #fffdf4;
			box-shadow: 0 12px 32px rgba(4, 40, 94, .24);
			text-align: center;
		}
		@media (orientation: landscape) {
			#game-frame { border-radius: 22px; }
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="theme-color" content="#149FE8">
</head>
<body data-shell="power-run-portrait-v1">
	<main id="game-frame">
		<canvas id="canvas">Your browser does not support canvas.</canvas>
		<div id="status" aria-live="polite">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
	</main>
	<script src="index.js"></script>
	<script>
		const frame = document.getElementById('game-frame');
		const canvas = document.getElementById('canvas');
		const status = document.getElementById('status');
		const progress = document.getElementById('status-progress');
		const notice = document.getElementById('status-notice');
		let resizeFrame = 0;

		function fitPortraitCanvas() {
			const availableWidth = Math.max(1, window.innerWidth);
			const availableHeight = Math.max(1, window.innerHeight);
			const maximumAspect = 9 / 16;
			let width = availableWidth;
			let height = availableHeight;
			if (width / height > maximumAspect) width = Math.floor(height * maximumAspect);
			frame.style.width = width + 'px';
			frame.style.height = height + 'px';
			// Bound the browser-only backing buffer; native mobile exports still
			// use the real device resolution.
			const pixelRatio = Math.min(window.devicePixelRatio || 1, 1);
			const backingWidth = Math.max(1, Math.round(width * pixelRatio));
			const backingHeight = Math.max(1, Math.round(height * pixelRatio));
			if (canvas.width !== backingWidth) canvas.width = backingWidth;
			if (canvas.height !== backingHeight) canvas.height = backingHeight;
		}

		fitPortraitCanvas();
		window.addEventListener('resize', () => {
			cancelAnimationFrame(resizeFrame);
			resizeFrame = requestAnimationFrame(fitPortraitCanvas);
		});

		const config = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7129568,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		config.canvas = canvas;
		config.canvasResizePolicy = 0;
		const engine = new Engine(config);

		function showFailure(error) {
			console.error(error);
			progress.style.display = 'none';
			notice.style.display = 'block';
			notice.textContent = error instanceof Error ? error.message : String(error);
		}

		const missing = Engine.getMissingFeatures({ threads: false });
		if (missing.length) {
			showFailure('Browser support is missing: ' + missing.join(', '));
		} else {
			engine.startGame({
				onProgress(current, total) {
					if (current > 0 && total > 0) {
						progress.value = current;
						progress.max = total;
					} else {
						progress.removeAttribute('value');
					}
				}
			}).then(() => {
				status.remove();
				canvas.focus();
			}).catch(showFailure);
		}
	</script>
</body>
</html>
