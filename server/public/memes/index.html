<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<base href="/memes/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Мемотека — архив мемов</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1e27;
    --card: #222633;
    --text: #e8eaf0;
    --muted: #8b91a3;
    --accent: #ffb02e;
    --accent-text: #1a1400;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #2b3040;
    padding: 12px 20px;
  }
  .head-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; max-width: 1600px; margin: 0 auto; }
  h1 { font-size: 20px; white-space: nowrap; }
  h1 .cnt { color: var(--muted); font-size: 14px; font-weight: normal; }
  #search {
    flex: 1; min-width: 180px; max-width: 420px;
    background: var(--card); border: 1px solid #2f3546; color: var(--text);
    padding: 8px 14px; border-radius: 20px; font-size: 14px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  select {
    background: var(--card); color: var(--text); border: 1px solid #2f3546;
    padding: 8px 10px; border-radius: 10px; font-size: 13px;
  }
  .source-note { color: var(--muted); font-size: 12px; text-decoration: none; margin-left: auto; }
  .source-note:hover { color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; max-width: 1600px; margin-inline: auto; }
  .chip {
    background: var(--card); border: 1px solid #2f3546; color: var(--text);
    padding: 6px 14px; border-radius: 16px; font-size: 13px; cursor: pointer;
    transition: 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .chip .n { opacity: 0.6; font-size: 11px; }

  #viewport { max-width: 1600px; margin: 0 auto; padding: 16px; }
  #spacer { position: relative; }
  .card {
    position: absolute;
    background: var(--card); border-radius: var(--radius); overflow: hidden;
    cursor: pointer; display: flex; flex-direction: column;
    border: 1px solid #2b3040;
    transition: transform 0.12s, border-color 0.12s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card img {
    width: 100%; flex: 1; object-fit: cover; min-height: 0;
    background: #171a22; display: block;
  }
  .card .meta { padding: 8px 10px; }
  .card .title {
    font-size: 13px; line-height: 1.35; height: 2.7em; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; }
  .badge { color: var(--accent); }

  #empty { text-align: center; color: var(--muted); padding: 80px 20px; font-size: 15px; display: none; }

  /* Лайтбокс */
  #lightbox {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(8,9,12,0.92); backdrop-filter: blur(4px);
    flex-direction: column; align-items: center; justify-content: center; padding: 20px;
  }
  #lightbox.open { display: flex; }
  #lb-img { max-width: 92vw; max-height: 78vh; border-radius: 8px; object-fit: contain; }
  #lb-title { margin-top: 14px; font-size: 16px; text-align: center; max-width: 800px; }
  #lb-info { margin-top: 6px; font-size: 13px; color: var(--muted); }
  #lb-info a { color: var(--accent); text-decoration: none; }
  .lb-nav {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: var(--card); border: 1px solid #2f3546; color: var(--text);
    width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer;
  }
  .lb-nav:hover { border-color: var(--accent); }
  #lb-prev { left: 16px; } #lb-next { right: 16px; }
  #lb-close { position: fixed; top: 16px; right: 16px; transform: none; }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>🤡 Мемотека <span class="cnt" id="count"></span></h1>
    <input id="search" type="search" placeholder="Поиск по названию…">
    <select id="sort">
      <option value="source">Исходный порядок</option>
      <option value="random">Случайный порядок</option>
      <option value="title">По алфавиту</option>
    </select>
    <a class="source-note" href="https://huggingface.co/datasets/foldl/rumeme-desc" target="_blank" rel="noopener">Источник · CC BY-SA 4.0 ↗</a>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div id="viewport">
  <div id="spacer"></div>
  <div id="empty">Ничего не найдено 🤷</div>
</div>

<div id="lightbox">
  <button class="lb-nav" id="lb-close" aria-label="Закрыть">✕</button>
  <button class="lb-nav" id="lb-prev" aria-label="Предыдущий мем">‹</button>
  <img id="lb-img" alt="">
  <div id="lb-title"></div>
  <div id="lb-info"></div>
  <button class="lb-nav" id="lb-next" aria-label="Следующий мем">›</button>
</div>

<script src="memes.js?v=20260710-language-filter"></script>
<script>
(() => {
  const ALL = (window.MEMES || []).map((m, i) => ({ ...m, _i: i }));
  const spacer = document.getElementById('spacer');
  const chipsEl = document.getElementById('chips');
  const countEl = document.getElementById('count');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');
  const sortEl = document.getElementById('sort');

  // --- фильтры ---
  let activeCat = null, query = '', filtered = ALL.slice();

  const cats = {};
  for (const m of ALL) cats[m.cat] = (cats[m.cat] || 0) + 1;

  function makeChip(label, n, cat) {
    const b = document.createElement('button');
    b.className = 'chip' + (cat === activeCat ? ' active' : '');
    b.innerHTML = `${label} <span class="n">${n}</span>`;
    b.onclick = () => { activeCat = cat; renderChips(); applyFilters(); };
    return b;
  }
  function renderChips() {
    chipsEl.innerHTML = '';
    chipsEl.appendChild(makeChip('Все', ALL.length, null));
    for (const [c, n] of Object.entries(cats).sort((a, b) => b[1] - a[1]))
      chipsEl.appendChild(makeChip(c, n, c));
  }

  function applyFilters() {
    const q = query.trim().toLowerCase();
    filtered = ALL.filter(m =>
      (!activeCat || m.cat === activeCat) &&
      (!q || m.title.toLowerCase().includes(q)));
    const s = sortEl.value;
    if (s === 'source') filtered.sort((a, b) => a._i - b._i);
    else if (s === 'title') filtered.sort((a, b) => a.title.localeCompare(b.title, 'ru'));
    else { // случайный, но стабильный в рамках сессии
      filtered.sort((a, b) => ((a._i * 2654435761) % 4096) - ((b._i * 2654435761) % 4096));
    }
    countEl.textContent = `— ${filtered.length} шт.`;
    emptyEl.style.display = filtered.length ? 'none' : 'block';
    layout(true);
  }

  // --- виртуальный скролл (грид: рендерим только видимые ряды) ---
  const CARD_H = 320, GAP = 14, MIN_COL_W = 230, OVERSCAN = 2;
  let cols = 1, rendered = new Map(); // index -> element

  function metrics() {
    const w = spacer.clientWidth;
    cols = Math.max(1, Math.floor((w + GAP) / (MIN_COL_W + GAP)));
    return { w, colW: (w - GAP * (cols - 1)) / cols };
  }

  function layout(reset) {
    if (reset) { rendered.forEach(el => el.remove()); rendered.clear(); }
    const { colW } = metrics();
    const rows = Math.ceil(filtered.length / cols);
    spacer.style.height = rows * (CARD_H + GAP) + 'px';

    const scroll = window.scrollY - spacer.offsetTop;
    const r0 = Math.max(0, Math.floor(scroll / (CARD_H + GAP)) - OVERSCAN);
    const r1 = Math.min(rows - 1, Math.ceil((scroll + innerHeight) / (CARD_H + GAP)) + OVERSCAN);
    const i0 = r0 * cols, i1 = Math.min(filtered.length - 1, (r1 + 1) * cols - 1);

    for (const [i, el] of rendered) {
      if (i < i0 || i > i1) { el.remove(); rendered.delete(i); }
    }
    for (let i = i0; i <= i1; i++) {
      if (rendered.has(i)) continue;
      const m = filtered[i];
      if (!m) continue;
      const el = document.createElement('div');
      el.className = 'card';
      const row = Math.floor(i / cols), col = i % cols;
      el.style.cssText = `top:${row * (CARD_H + GAP)}px;left:${col * (colW + GAP)}px;width:${colW}px;height:${CARD_H}px`;
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = m.thumb;
      img.alt = m.title;
      img.onerror = () => {
        if (img.dataset.fallback) img.style.display = 'none';
        else { img.dataset.fallback = '1'; img.src = m.url; }
      };
      const body = document.createElement('div');
      body.className = 'meta';
      body.innerHTML = `
          <div class="title">${esc(m.title)}</div>
          <div class="sub"><span>${esc(m.cat)}</span><span class="badge">${esc(m.id)}</span></div>`;
      el.append(img, body);
      el.onclick = () => openLb(i);
      spacer.appendChild(el);
      rendered.set(i, el);
    }
  }

  function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  let ticking = false;
  addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(() => { layout(false); ticking = false; }); }
  }, { passive: true });
  addEventListener('resize', () => layout(true));

  // --- лайтбокс ---
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbTitle = document.getElementById('lb-title');
  const lbInfo = document.getElementById('lb-info');
  let lbIdx = -1;

  function openLb(i) {
    lbIdx = i;
    const m = filtered[i];
    if (!m) return;
    lbImg.src = m.url;
    lbTitle.textContent = m.title;
    const link = document.createElement('a');
    link.href = m.link;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'источник ↗';
    lbInfo.replaceChildren(document.createTextNode(`${m.cat} · ${m.id} · `), link);
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  function step(d) { if (filtered.length) openLb((lbIdx + d + filtered.length) % filtered.length); }

  document.getElementById('lb-close').onclick = closeLb;
  document.getElementById('lb-prev').onclick = e => { e.stopPropagation(); step(-1); };
  document.getElementById('lb-next').onclick = e => { e.stopPropagation(); step(1); };
  lb.onclick = e => { if (e.target === lb || e.target === lbImg) closeLb(); };
  addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  // --- события ---
  let debounce;
  searchEl.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { query = searchEl.value; applyFilters(); }, 200);
  });
  sortEl.addEventListener('change', applyFilters);

  renderChips();
  applyFilters();
})();
</script>
</body>
</html>
