<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<base href="/memes/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мемотека — архив мемов</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1e27;
    --card: #222633;
    --text: #e8eaf0;
    --muted: #8b91a3;
    --accent: #ffb02e;
    --accent-text: #1a1400;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #2b3040;
    padding: 12px 20px;
  }
  .head-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; max-width: 1600px; margin: 0 auto; }
  h1 { font-size: 20px; white-space: nowrap; }
  h1 .cnt { color: var(--muted); font-size: 14px; font-weight: normal; }
  #search {
    flex: 1; min-width: 180px; max-width: 420px;
    background: var(--card); border: 1px solid #2f3546; color: var(--text);
    padding: 8px 14px; border-radius: 20px; font-size: 14px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  select {
    background: var(--card); color: var(--text); border: 1px solid #2f3546;
    padding: 8px 10px; border-radius: 10px; font-size: 13px;
  }
  .source-note { color: var(--muted); font-size: 12px; text-decoration: none; margin-left: auto; }
  .source-note:hover { color: var(--accent); }
  .filter-row { display: flex; align-items: flex-start; gap: 10px; max-width: 1600px; margin: 10px auto 0; }
  .filter-label { color: var(--muted); font-size: 12px; line-height: 32px; min-width: 42px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--card); border: 1px solid #2f3546; color: var(--text);
    padding: 6px 14px; border-radius: 16px; font-size: 13px; cursor: pointer;
    transition: 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .chip .n { opacity: 0.6; font-size: 11px; }
  .selection-bar { display: flex; align-items: center; gap: 8px; max-width: 1600px; margin: 10px auto 0; flex-wrap: wrap; }
  .selection-bar button {
    background: var(--card); border: 1px solid #2f3546; color: var(--text);
    padding: 7px 12px; border-radius: 10px; cursor: pointer;
  }
  .selection-bar input {
    width: 96px; background: var(--card); border: 1px solid #2f3546; color: var(--text);
    padding: 7px 10px; border-radius: 10px; outline: none;
  }
  .selection-bar input:focus { border-color: var(--accent); }
  .selection-bar button:hover:not(:disabled) { border-color: var(--accent); }
  .selection-bar button:disabled { opacity: 0.45; cursor: default; }
  #delete-selected, #download-delete { display: none; border-color: #ef4444; color: #fecaca; }
  #selected-count { color: var(--muted); font-size: 12px; min-width: 82px; }

  #viewport { max-width: 1600px; margin: 0 auto; padding: 16px; }
  #spacer { position: relative; }
  .card {
    position: absolute;
    background: var(--card); border-radius: var(--radius); overflow: hidden;
    cursor: pointer; display: flex; flex-direction: column;
    border: 1px solid #2b3040;
    transition: transform 0.12s, border-color 0.12s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); }
  .card-select { position: absolute; z-index: 2; top: 10px; left: 10px; width: 22px; height: 22px; accent-color: var(--accent); }
  .card img {
    width: 100%; flex: 1; object-fit: cover; min-height: 0;
    background: #171a22; display: block;
  }
  .card .meta { padding: 8px 10px; }
  .card .title {
    font-size: 13px; line-height: 1.35; height: 2.7em; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; }
  .badge { color: var(--accent); }

  #empty { text-align: center; color: var(--muted); padding: 80px 20px; font-size: 15px; display: none; }

  /* Лайтбокс */
  #lightbox {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(8,9,12,0.92); backdrop-filter: blur(4px);
    flex-direction: column; align-items: center; justify-content: center; padding: 20px;
  }
  #lightbox.open { display: flex; }
  #lb-img { max-width: 92vw; max-height: 78vh; border-radius: 8px; object-fit: contain; }
  #lb-title { margin-top: 14px; font-size: 16px; text-align: center; max-width: 800px; }
  #lb-info { margin-top: 6px; font-size: 13px; color: var(--muted); }
  #lb-info a { color: var(--accent); text-decoration: none; }
  #lb-delete {
    display: none; margin-top: 14px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid #ef4444; background: #35191d; color: #fecaca; cursor: pointer;
  }
  #lb-delete:hover { background: #4b1d22; }
  #lb-delete:disabled { opacity: 0.6; cursor: wait; }
  .lb-nav {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: var(--card); border: 1px solid #2f3546; color: var(--text);
    width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer;
  }
  .lb-nav:hover { border-color: var(--accent); }
  #lb-prev { left: 16px; } #lb-next { right: 16px; }
  #lb-close { position: fixed; top: 16px; right: 16px; transform: none; }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>🤡 Мемотека <span class="cnt" id="count"></span></h1>
    <input id="search" type="search" placeholder="Поиск по названию…">
    <select id="sort">
      <option value="source">Исходный порядок</option>
      <option value="random">Случайный порядок</option>
      <option value="title">По алфавиту</option>
    </select>
    <span class="source-note">Личная мемотека · источники в карточках</span>
  </div>
  <div class="filter-row"><span class="filter-label">Тема</span><div class="chips" id="chips"></div></div>
  <div class="filter-row"><span class="filter-label">Язык</span><div class="chips" id="language-chips"></div></div>
  <div class="selection-bar">
    <button id="select-visible" type="button">Выбрать все показанные</button>
    <input id="select-count" type="number" min="1" step="1" inputmode="numeric" placeholder="Сколько" aria-label="Сколько первых мемов выбрать">
    <button id="select-count-button" type="button">Выбрать</button>
    <button id="clear-selection" type="button" disabled>Снять выбор</button>
    <span id="selected-count">Выбрано: 0</span>
    <button id="download-selected" type="button" disabled>Скачать</button>
    <button id="delete-selected" type="button" disabled>Удалить</button>
    <button id="download-delete" type="button" disabled>Скачать и удалить</button>
  </div>
</header>

<div id="viewport">
  <div id="spacer"></div>
  <div id="empty">Ничего не найдено 🤷</div>
</div>

<div id="lightbox">
  <button class="lb-nav" id="lb-close" aria-label="Закрыть">✕</button>
  <button class="lb-nav" id="lb-prev" aria-label="Предыдущий мем">‹</button>
  <img id="lb-img" alt="">
  <div id="lb-title"></div>
  <div id="lb-info"></div>
  <button id="lb-delete" type="button">Удалить мем</button>
  <button class="lb-nav" id="lb-next" aria-label="Следующий мем">›</button>
</div>

<script src="memes.js?v=20260712-language-batches-010-012"></script>
<script>
(() => {
  const ALL = (window.MEMES || []).map((m, i) => ({ ...m, _i: i }));
  const spacer = document.getElementById('spacer');
  const chipsEl = document.getElementById('chips');
  const languageChipsEl = document.getElementById('language-chips');
  const countEl = document.getElementById('count');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');
  const sortEl = document.getElementById('sort');
  const selectedCountEl = document.getElementById('selected-count');
  const selectVisibleButton = document.getElementById('select-visible');
  const selectCountInput = document.getElementById('select-count');
  const selectCountButton = document.getElementById('select-count-button');
  const clearSelectionButton = document.getElementById('clear-selection');
  const downloadButton = document.getElementById('download-selected');
  const deleteButton = document.getElementById('delete-selected');
  const downloadDeleteButton = document.getElementById('download-delete');
  const selectedIds = new Set();
  let lastSelectedId = null;

  // --- фильтры ---
  let activeCat = null, activeLang = null, query = '', filtered = ALL.slice();

  const cats = {};
  for (const m of ALL) cats[m.cat] = (cats[m.cat] || 0) + 1;
  const languageNames = {
    ar: 'Арабский', de: 'Немецкий', en: 'Английский', es: 'Испанский',
    fr: 'Французский', it: 'Итальянский', ja: 'Японский', pl: 'Польский',
    pt: 'Португальский', ro: 'Румынский', ru: 'Русский', und: 'Не определён',
  };
  const languageOf = m => m.lang || 'und';
  const languages = {};
  for (const m of ALL) {
    const lang = languageOf(m);
    languages[lang] = (languages[lang] || 0) + 1;
  }

  function makeChip(label, n, value, active, onSelect) {
    const b = document.createElement('button');
    b.className = 'chip' + (value === active ? ' active' : '');
    b.innerHTML = `${label} <span class="n">${n}</span>`;
    b.onclick = () => { onSelect(value); renderChips(); applyFilters(); };
    return b;
  }
  function renderChips() {
    chipsEl.innerHTML = '';
    chipsEl.appendChild(makeChip('Все', ALL.length, null, activeCat, value => { activeCat = value; }));
    for (const [c, n] of Object.entries(cats).sort((a, b) => b[1] - a[1]))
      chipsEl.appendChild(makeChip(c, n, c, activeCat, value => { activeCat = value; }));

    languageChipsEl.innerHTML = '';
    languageChipsEl.appendChild(makeChip('Все', ALL.length, null, activeLang, value => { activeLang = value; }));
    for (const [lang, n] of Object.entries(languages).sort(([a], [b]) =>
      (languageNames[a] || a).localeCompare(languageNames[b] || b, 'ru')))
      languageChipsEl.appendChild(makeChip(languageNames[lang] || lang, n, lang, activeLang, value => { activeLang = value; }));
  }

  function applyFilters() {
    const q = query.trim().toLowerCase();
    filtered = ALL.filter(m =>
      (!activeCat || m.cat === activeCat) &&
      (!activeLang || languageOf(m) === activeLang) &&
      (!q || m.title.toLowerCase().includes(q)));
    const s = sortEl.value;
    if (s === 'source') filtered.sort((a, b) => a._i - b._i);
    else if (s === 'title') filtered.sort((a, b) => a.title.localeCompare(b.title, 'ru'));
    else { // случайный, но стабильный в рамках сессии
      filtered.sort((a, b) => ((a._i * 2654435761) % 4096) - ((b._i * 2654435761) % 4096));
    }
    countEl.textContent = `— ${filtered.length} шт.`;
    emptyEl.style.display = filtered.length ? 'none' : 'block';
    updateSelectionBar();
    layout(true);
  }

  function updateSelectionBar() {
    selectedCountEl.textContent = `Выбрано: ${selectedIds.size}`;
    clearSelectionButton.disabled = selectedIds.size === 0;
    downloadButton.disabled = selectedIds.size === 0;
    deleteButton.disabled = selectedIds.size === 0;
    downloadDeleteButton.disabled = selectedIds.size === 0;
    selectVisibleButton.disabled = filtered.length === 0;
    const requestedCount = Number.parseInt(selectCountInput.value, 10);
    selectCountButton.disabled = filtered.length === 0 || !Number.isFinite(requestedCount) || requestedCount < 1;
  }

  function updateRangeSelection(index, selected) {
    const previousIndex = filtered.findIndex(meme => meme.id === lastSelectedId);
    if (previousIndex >= 0) {
      const from = Math.min(previousIndex, index);
      const to = Math.max(previousIndex, index);
      for (let rangeIndex = from; rangeIndex <= to; rangeIndex++) {
        if (selected) selectedIds.add(filtered[rangeIndex].id);
        else selectedIds.delete(filtered[rangeIndex].id);
      }
    } else if (selected) selectedIds.add(filtered[index].id);
    else selectedIds.delete(filtered[index].id);
    lastSelectedId = filtered[index].id;
    updateSelectionBar();
    layout(true);
  }

  // --- виртуальный скролл (грид: рендерим только видимые ряды) ---
  const CARD_H = 320, GAP = 14, MIN_COL_W = 230, OVERSCAN = 2;
  let cols = 1, rendered = new Map(); // index -> element

  function metrics() {
    const w = spacer.clientWidth;
    cols = Math.max(1, Math.floor((w + GAP) / (MIN_COL_W + GAP)));
    return { w, colW: (w - GAP * (cols - 1)) / cols };
  }

  function layout(reset) {
    if (reset) { rendered.forEach(el => el.remove()); rendered.clear(); }
    const { colW } = metrics();
    const rows = Math.ceil(filtered.length / cols);
    spacer.style.height = rows * (CARD_H + GAP) + 'px';

    const scroll = window.scrollY - spacer.offsetTop;
    const r0 = Math.max(0, Math.floor(scroll / (CARD_H + GAP)) - OVERSCAN);
    const r1 = Math.min(rows - 1, Math.ceil((scroll + innerHeight) / (CARD_H + GAP)) + OVERSCAN);
    const i0 = r0 * cols, i1 = Math.min(filtered.length - 1, (r1 + 1) * cols - 1);

    for (const [i, el] of rendered) {
      if (i < i0 || i > i1) { el.remove(); rendered.delete(i); }
    }
    for (let i = i0; i <= i1; i++) {
      if (rendered.has(i)) continue;
      const m = filtered[i];
      if (!m) continue;
      const el = document.createElement('div');
      el.className = 'card' + (selectedIds.has(m.id) ? ' selected' : '');
      const row = Math.floor(i / cols), col = i % cols;
      el.style.cssText = `top:${row * (CARD_H + GAP)}px;left:${col * (colW + GAP)}px;width:${colW}px;height:${CARD_H}px`;
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.fetchPriority = 'low';
      img.src = m.thumb;
      img.alt = m.title;
      img.onerror = () => {
        if (img.dataset.fallback) img.style.display = 'none';
        else { img.dataset.fallback = '1'; img.src = m.url; }
      };
      const body = document.createElement('div');
      body.className = 'meta';
      body.innerHTML = `
          <div class="title">${esc(m.title)}</div>
          <div class="sub"><span>${esc(m.cat)}</span><span class="badge">${esc(m.id)}</span></div>`;
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'card-select';
      checkbox.checked = selectedIds.has(m.id);
      checkbox.setAttribute('aria-label', `Выбрать ${m.id}`);
      checkbox.onclick = event => {
        event.stopPropagation();
        if (event.shiftKey) {
          updateRangeSelection(i, checkbox.checked);
          return;
        }
        if (checkbox.checked) selectedIds.add(m.id); else selectedIds.delete(m.id);
        lastSelectedId = m.id;
        el.classList.toggle('selected', checkbox.checked);
        updateSelectionBar();
      };
      el.append(checkbox, img, body);
      el.onclick = event => {
        if (event.shiftKey) {
          event.preventDefault();
          updateRangeSelection(i, true);
          return;
        }
        openLb(i);
      };
      spacer.appendChild(el);
      rendered.set(i, el);
    }
  }

  function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  let ticking = false;
  addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(() => { layout(false); ticking = false; }); }
  }, { passive: true });
  addEventListener('resize', () => layout(true));

  // --- лайтбокс ---
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbTitle = document.getElementById('lb-title');
  const lbInfo = document.getElementById('lb-info');
  const lbDelete = document.getElementById('lb-delete');
  let lbIdx = -1;
  let canDelete = false;

  function openLb(i) {
    lbIdx = i;
    const m = filtered[i];
    if (!m) return;
    lbImg.src = m.url;
    lbTitle.textContent = m.title;
    const link = document.createElement('a');
    link.href = m.link;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'источник ↗';
    lbInfo.replaceChildren(document.createTextNode(`${m.cat} · ${m.id} · `), link);
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  function step(d) { if (filtered.length) openLb((lbIdx + d + filtered.length) % filtered.length); }

  fetch('/api/auth/me')
    .then(response => response.ok ? response.json() : null)
    .then(user => {
      canDelete = Boolean(user?.isSuperAdmin);
      lbDelete.style.display = canDelete ? 'block' : 'none';
      deleteButton.style.display = canDelete ? 'block' : 'none';
      downloadDeleteButton.style.display = canDelete ? 'block' : 'none';
    })
    .catch(() => {});

  lbDelete.onclick = async event => {
    event.stopPropagation();
    const meme = filtered[lbIdx];
    if (!canDelete || !meme || !confirm(`Удалить мем ${meme.id}? Это действие нельзя отменить.`)) return;
    lbDelete.disabled = true;
    lbDelete.textContent = 'Удаление…';
    try {
      const response = await fetch(`/api/memes/${encodeURIComponent(meme.id)}`, { method: 'DELETE' });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || 'Не удалось удалить мем');
      location.reload();
    } catch (error) {
      alert(error instanceof Error ? error.message : 'Не удалось удалить мем');
      lbDelete.disabled = false;
      lbDelete.textContent = 'Удалить мем';
    }
  };

  selectVisibleButton.onclick = () => {
    for (const meme of filtered) selectedIds.add(meme.id);
    lastSelectedId = filtered.at(-1)?.id ?? lastSelectedId;
    updateSelectionBar();
    layout(true);
  };
  selectCountInput.oninput = updateSelectionBar;
  selectCountInput.onkeydown = event => {
    if (event.key === 'Enter' && !selectCountButton.disabled) selectCountButton.click();
  };
  selectCountButton.onclick = () => {
    const count = Math.min(filtered.length, Number.parseInt(selectCountInput.value, 10));
    if (!Number.isFinite(count) || count < 1) return;
    selectedIds.clear();
    for (const meme of filtered.slice(0, count)) selectedIds.add(meme.id);
    lastSelectedId = filtered[count - 1]?.id ?? null;
    updateSelectionBar();
    layout(true);
  };
  clearSelectionButton.onclick = () => {
    selectedIds.clear();
    lastSelectedId = null;
    updateSelectionBar();
    layout(true);
  };

  async function downloadSelected() {
    const ids = [...selectedIds];
    const response = await fetch('/api/memes/download', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }),
    });
    if (!response.ok) {
      const result = await response.json().catch(() => ({}));
      throw new Error(result.error || 'Не удалось скачать мемы');
    }
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `memoteka-${ids.length}.zip`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60_000);
    return ids;
  }

  downloadButton.onclick = async () => {
    downloadButton.disabled = true;
    try { await downloadSelected(); }
    catch (error) { alert(error instanceof Error ? error.message : 'Не удалось скачать мемы'); }
    finally { updateSelectionBar(); }
  };

  deleteButton.onclick = async () => {
    if (!canDelete || !selectedIds.size || !confirm(`Окончательно удалить ${selectedIds.size} шт. из локальной и публичной Мемотеки?`)) return;
    deleteButton.disabled = true;
    try {
      const response = await fetch('/api/memes/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: [...selectedIds] }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || 'Не удалось удалить мемы');
      location.reload();
    } catch (error) {
      alert(error instanceof Error ? error.message : 'Не удалось удалить мемы');
    } finally {
      updateSelectionBar();
    }
  };

  downloadDeleteButton.onclick = async () => {
    if (!canDelete || !selectedIds.size || !confirm(`Скачать ${selectedIds.size} шт., а затем удалить их из локальной и публичной Мемотеки?`)) return;
    downloadDeleteButton.disabled = true;
    try {
      const ids = await downloadSelected();
      if (!confirm('Архив подготовлен и передан браузеру. Теперь окончательно удалить выбранные мемы?')) return;
      const response = await fetch('/api/memes/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || 'Не удалось удалить мемы');
      location.reload();
    } catch (error) {
      alert(error instanceof Error ? error.message : 'Операция не выполнена');
    } finally {
      updateSelectionBar();
    }
  };

  document.getElementById('lb-close').onclick = closeLb;
  document.getElementById('lb-prev').onclick = e => { e.stopPropagation(); step(-1); };
  document.getElementById('lb-next').onclick = e => { e.stopPropagation(); step(1); };
  lb.onclick = e => { if (e.target === lb || e.target === lbImg) closeLb(); };
  addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  // --- события ---
  let debounce;
  searchEl.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { query = searchEl.value; applyFilters(); }, 200);
  });
  sortEl.addEventListener('change', applyFilters);

  renderChips();
  applyFilters();
})();
</script>
</body>
</html>
