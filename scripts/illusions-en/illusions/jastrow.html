<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions host v2 (variants + localizable title overlay)</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST v2 — variant-aware + localizable title overlay.
  //  Edit ONLY the two marked regions: (1) SPEC block, (2) drawIllusion().
  //  New vs v1:
  //   - H.v  = variant params {palette,dir,turns,speed,seed,density,angle} (from SPEC.variant)
  //   - H.PALETTES / H.pal(t) / H.palStops()  = named colour schemes for variants
  //   - window.renderTitle(text) -> TRANSPARENT png with ONLY the title (for ffmpeg overlay,
  //     so one titleless geometry render is reused across all 5 languages)
  //   - canvas is alpha:true; renderFrame() fills its own opaque background.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: true });

  function mulberry32(seed) {
    let s = (seed >>> 0) || 1;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  // Named palettes: ordered RGB stops. H.pal(t) interpolates across them; H.palStops() returns raw stops.
  const PALETTES = {
    classic:  [[75,58,255],[255,35,112],[38,255,132],[44,150,255]], // v1 spectrum (default look)
    spectrum: [[75,58,255],[255,35,112],[38,255,132],[44,150,255]],
    aurora:   [[130,255,200],[120,180,255],[180,120,255],[255,140,220]],
    fire:     [[255,210,90],[255,120,40],[255,60,60],[210,40,120]],
    ice:      [[200,240,255],[120,190,255],[255,255,255],[90,150,230]],
    neon:     [[80,255,140],[190,255,60],[40,230,180],[120,255,90]],
    gold:     [[255,235,170],[255,190,80],[255,250,210],[210,150,50]],
    sunset:   [[255,180,90],[255,90,120],[200,70,200],[120,80,220]],
    emerald:  [[170,255,210],[60,220,150],[30,180,140],[120,255,180]],
    magma:    [[255,230,120],[255,140,40],[230,40,40],[120,20,60]],
    mono:     [[255,255,255],[210,210,210],[170,170,170],[235,235,235]],
    candy:    [[255,160,210],[120,210,255],[255,225,130],[180,160,255]],
  };
  function palStops(name) { return PALETTES[name] || PALETTES.classic; }
  function pal(t, name) {
    const s = palStops(name || (V && V.palette) || 'classic');
    t = clamp(t, 0, 1) * (s.length - 1);
    const i = Math.min(s.length - 2, Math.floor(t)), f = t - i;
    const a = s[i], b = s[i + 1];
    return `rgb(${Math.round(lerp(a[0],b[0],f))} ${Math.round(lerp(a[1],b[1],f))} ${Math.round(lerp(a[2],b[2],f))})`;
  }

  // active variant (filled at setup)
  let V = { palette: 'classic', dir: 1, turns: 1, speed: 1, seed: 1, density: 1, angle: 0 };

  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE, maxR: 460,
              PALETTES, pal, palStops, get v() { return V; } };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'jastrow',
    name: 'Jastrow illusion',
    title: 'These two arcs are identical',
    dur: 8,            // seconds
    fps: 30,
    light: false,      // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const S = H.safe;
    // ---- Jastrow illusion ---------------------------------------------------
    // Two ring-segment "bananas" (annular sectors). Each is an arch opening
    // DOWNWARD: its OUTER arc is the LONG, gently-curved CONVEX crown on top; its
    // INNER arc is the SHORT, sharply-curved CONCAVE edge underneath; two radial
    // cuts close the ends. Both pieces have the SAME ring WIDTH (rOut-rIn) and the
    // SAME angular sweep, so they read as the same shape.
    //
    // THE JASTROW CUE. Nest the two pieces so the UPPER one's SHORT CONCAVE
    // (inner) bottom edge sits, across a thin slit, directly above the LOWER one's
    // LONG CONVEX (outer) top edge. The LOWER banana is drawn on a slightly larger
    // radius, so its long convex top edge runs flatter and its radial-cut TIPS
    // extend visibly WIDER on BOTH sides (~50px per side) than the upper banana's
    // tips. Set right under the upper piece's tightly-curved short edge, the lower
    // banana unmistakably looks the bigger one -- the classic Jastrow size cue.
    // (NOT two arcs sharing one centre: same-centre concentric arcs line up
    // tip-to-tip and show no size difference at all -- that is the failure mode.)
    //
    // ANIMATION (seamless loop): the two bananas continuously trade the upper /
    // lower roles, and each piece's radius is tied to how LOW it sits -- the lower
    // role is always the bigger-looking one. They start NESTED (gold small on top,
    // cyan the bigger lower one); they slide apart to the SAME height where, being
    // momentarily the same size, they sit clearly SIDE BY SIDE proving they are the
    // identical shape; then re-nest with the roles (and colours) swapped, and glide
    // back. A swap parameter s = (1-cos(2*pi*p))/2 drives it; s(0)=s(1)=0 so the
    // last frame equals the first. Bright shapes on black.

    const cx = Math.round((S.x0 + S.x1) / 2);     // 540, shared horizontal centre

    // --- ring-segment geometry (Imai's optimum proportions) ------------------
    // Constant ring WIDTH and angular sweep for BOTH pieces (so they read as the
    // same shape); only the radius scales with vertical role. 80deg opening
    // (half = 40deg), opening down. rIn = 0.6*rOut at the reference radius.
    const half = 40 * Math.PI / 180;               // half angular sweep = 40deg (80deg opening)
    const BAND = 152;                               // ring width, identical for both pieces
    const rOutSmall = 330, rOutBig = 408;           // upper(small) vs lower(big) outer radius
    // tip protrusion of the big piece over the small one = (rOutBig-rOutSmall)*sin(half) ~= 50px/side.

    // Build the banana path for a sector of outer radius rOut whose curvature
    // centre is at (px, cyc). Outer arc L->R along the top, inner arc R->L back.
    const bananaPath = (px, cyc, rOut) => {
      const rIn = rOut - BAND;
      const a0 = -Math.PI / 2 - half;              // left end angle (from centre)
      const a1 = -Math.PI / 2 + half;              // right end angle
      ctx.beginPath();
      ctx.arc(px, cyc, rOut, a0, a1, false);       // outer arc, L -> R (top crown)
      ctx.arc(px, cyc, rIn, a1, a0, true);         // inner arc, R -> L (under crown)
      ctx.closePath();
    };

    // Paint one banana (fill + thin rim) by its curvature centre cyc & outer radius.
    const drawBanana = (px, cyc, rOut, fill, rim) => {
      ctx.save();
      bananaPath(px, cyc, rOut);
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 6;
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.restore();
      // crisp rim, no shadow
      ctx.save();
      bananaPath(px, cyc, rOut);
      ctx.lineWidth = 3;
      ctx.strokeStyle = rim;
      ctx.stroke();
      ctx.restore();
    };

    // --- seamless swap parameter ---------------------------------------------
    let s = (1 - Math.cos(TAU * p)) / 2;            // 0 ->1 ->0 over the loop
    s = clamp(s, 0, 1);

    // --- geometry of a piece given its "lowerness" L in [0,1] ----------------
    // L=0 -> the small UPPER piece; L=1 -> the big LOWER piece; L=0.5 -> midway
    // (both pieces equal here at the side-by-side crossover, proving congruence).
    // The NESTED endpoints are tuned so that at L=0 the small piece's outer crown
    // sits high and at L=1 the big piece nests one SLIT below the small piece's
    // short concave edge, its wide tips overhanging on both sides.
    const SLIT = 18;
    const topY = 690;                               // small piece's outer-crown apex when fully upper
    const rInSmall = rOutSmall - BAND;
    const cycSmallUp = topY + rOutSmall;            // small piece's centre when fully upper
    const smallInnerCrown = cycSmallUp - rInSmall;  // its short concave edge crown (= nest line)
    const bigOuterCrown = smallInnerCrown + SLIT;   // big piece's long convex crown, one slit lower
    // For a smooth swap we glide BOTH the centre and the radius with L.
    const pieceGeom = (L) => {
      const e = smooth(L);                          // eased lowerness
      const rOut = lerp(rOutSmall, rOutBig, e);     // grows as it sinks
      // its outer-crown apex glides from topY (upper) down to bigOuterCrown (lower)
      const outerCrownY = lerp(topY, bigOuterCrown, e);
      const cyc = outerCrownY + rOut;               // curvature centre
      return { rOut, cyc };
    };

    // A starts UPPER (L=0 at s=0), sinks to LOWER (L=1 at s=1) and back; B mirrors.
    const gA = pieceGeom(s);
    const gB = pieceGeom(1 - s);

    // Horizontal SPREAD so that at the crossover (s~0.5) the two now-equal arcs sit
    // clearly SIDE BY SIDE (not overlapping into one blob), reading as "two
    // congruent shapes". Peaks at s=0.5, zero at s=0/1.
    const spread = Math.sin(s * Math.PI) * 250;     // 0 ->250 ->0
    const xA = cx - spread;                         // A drifts left while crossing
    const xB = cx + spread;                         // B drifts right while crossing

    // Colours: warm gold (A) vs cool cyan (B) so the swap is unmistakable and the
    // two are still obviously the SAME shape. Bright on black.
    const GOLD = 'rgb(255,196,64)',  GOLD_RIM = 'rgba(120,80,0,0.7)';
    const CYAN = 'rgb(96,214,255)',  CYAN_RIM = 'rgba(0,70,110,0.7)';

    // Draw the LOWER piece (larger cyc) first so the UPPER one overlaps it at the
    // slit -- keeps the nested concave-over-convex look correct in BOTH the start
    // and swapped states.
    const A = { x: xA, cyc: gA.cyc, rOut: gA.rOut, fill: GOLD, rim: GOLD_RIM };
    const B = { x: xB, cyc: gB.cyc, rOut: gB.rOut, fill: CYAN, rim: CYAN_RIM };
    const lower = A.cyc >= B.cyc ? A : B;           // larger cyc = lower on screen = drawn behind
    const upper = A.cyc >= B.cyc ? B : A;
    drawBanana(lower.x, lower.cyc, lower.rOut, lower.fill, lower.rim);
    drawBanana(upper.x, upper.cyc, upper.rOut, upper.fill, upper.rim);

    void H.rng; // deterministic geometry; no randomness needed
  }
  // ===========================================================================

  // ---------------- title (identical layout to v1; drawn as overlay or inline) ----------
  let TITLE_LINES = [], TITLE_PX = 60, TITLE_TEXT = '';
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    TITLE_TEXT = String(text || '');
    const words = TITLE_TEXT.trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function paintTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.64, 'rgba(0,0,0,0.12)'); g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') {
      const { variant, ...rest } = overrides;
      SPEC = { ...SPEC, ...rest };
      if (variant && typeof variant === 'object') SPEC.variant = variant;
    }
    V = { palette: 'classic', dir: 1, turns: 1, speed: 1, seed: 1, density: 1, angle: 0, ...(SPEC.variant || {}) };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, light: !!SPEC.light, variant: V, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC, v: { ...V } }; };

  // Full frame (background + illusion + vignette + INLINE title). Used for standalone preview.
  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    paintTitle();
    return canvas.toDataURL('image/png');
  };
  // Geometry only, NO title (opaque). Rendered ONCE; localized titles overlaid later.
  window.renderBase = function (progress) {
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    return canvas.toDataURL('image/png');
  };
  // TRANSPARENT png with ONLY the title (pill + text), for ffmpeg overlay onto a titleless clip.
  window.renderTitle = function (text) {
    layoutTitle(text);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, CW, CH);
    paintTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
