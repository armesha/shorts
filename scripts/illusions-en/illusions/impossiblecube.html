<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions host v2 (variants + localizable title overlay)</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST v2 — variant-aware + localizable title overlay.
  //  Edit ONLY the two marked regions: (1) SPEC block, (2) drawIllusion().
  //  New vs v1:
  //   - H.v  = variant params {palette,dir,turns,speed,seed,density,angle} (from SPEC.variant)
  //   - H.PALETTES / H.pal(t) / H.palStops()  = named colour schemes for variants
  //   - window.renderTitle(text) -> TRANSPARENT png with ONLY the title (for ffmpeg overlay,
  //     so one titleless geometry render is reused across all 5 languages)
  //   - canvas is alpha:true; renderFrame() fills its own opaque background.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: true });

  function mulberry32(seed) {
    let s = (seed >>> 0) || 1;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  // Named palettes: ordered RGB stops. H.pal(t) interpolates across them; H.palStops() returns raw stops.
  const PALETTES = {
    classic:  [[75,58,255],[255,35,112],[38,255,132],[44,150,255]], // v1 spectrum (default look)
    spectrum: [[75,58,255],[255,35,112],[38,255,132],[44,150,255]],
    aurora:   [[130,255,200],[120,180,255],[180,120,255],[255,140,220]],
    fire:     [[255,210,90],[255,120,40],[255,60,60],[210,40,120]],
    ice:      [[200,240,255],[120,190,255],[255,255,255],[90,150,230]],
    neon:     [[80,255,140],[190,255,60],[40,230,180],[120,255,90]],
    gold:     [[255,235,170],[255,190,80],[255,250,210],[210,150,50]],
    sunset:   [[255,180,90],[255,90,120],[200,70,200],[120,80,220]],
    emerald:  [[170,255,210],[60,220,150],[30,180,140],[120,255,180]],
    magma:    [[255,230,120],[255,140,40],[230,40,40],[120,20,60]],
    mono:     [[255,255,255],[210,210,210],[170,170,170],[235,235,235]],
    candy:    [[255,160,210],[120,210,255],[255,225,130],[180,160,255]],
  };
  function palStops(name) { return PALETTES[name] || PALETTES.classic; }
  function pal(t, name) {
    const s = palStops(name || (V && V.palette) || 'classic');
    t = clamp(t, 0, 1) * (s.length - 1);
    const i = Math.min(s.length - 2, Math.floor(t)), f = t - i;
    const a = s[i], b = s[i + 1];
    return `rgb(${Math.round(lerp(a[0],b[0],f))} ${Math.round(lerp(a[1],b[1],f))} ${Math.round(lerp(a[2],b[2],f))})`;
  }

  // active variant (filled at setup)
  let V = { palette: 'classic', dir: 1, turns: 1, speed: 1, seed: 1, density: 1, angle: 0 };

  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE, maxR: 460,
              PALETTES, pal, palStops, get v() { return V; } };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'impossiblecube',
    name: 'Impossible cube',
    title: 'Look closely — it cannot be built',
    dur: 8,            // seconds
    fps: 30,
    light: false,      // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const TAU = H.TAU;
    // -------------------------------------------------------------------------
    //  IMPOSSIBLE CUBE (Escher)
    //  A cube built from twelve SOLID square-section beams in a Necker/cabinet
    //  oblique layout: a FRONT square + an identical BACK square offset up-right,
    //  joined by 4 connectors. Each beam is a faux-3D bar with three tones (a
    //  light top, a mid face, a dark face) so it reads as a 3-D timber, on black.
    //
    //  The impossibility: we draw the beams in correct back-to-front (painter's)
    //  order for ELEVEN beams, but at ONE crossing we make a BACK-square beam
    //  pass IN FRONT of a FRONT-square beam it crosses. The eye accepts each
    //  local junction yet the whole object cannot exist in 3-D space.
    //
    //  The figure rotates slowly in-plane by exactly ONE full turn over the clip
    //  (ang = p*TAU) so draw(0) === draw(1): a perfectly seamless loop. (Rotating
    //  the picture in its own plane preserves every overlap, so the impossible
    //  crossing stays impossible the whole way round.)
    // -------------------------------------------------------------------------
    const cx = H.cx;
    const cy = (H.safe.y0 + H.safe.y1) / 2;            // vertical centre of safe band (~950)

    // ---- cube geometry (cabinet oblique, classic Necker layout) --------------
    // Front face = axis-aligned square of half-side A. Back face = identical
    // square shifted by (OX,OY) (up & to the right). No perspective: equal size,
    // so the depth is ambiguous — exactly what lets one crossing read either way.
    const A = 250;                                     // half-side of each square
    const OX = 168, OY = -168;                         // back-face offset (up-right)
    // re-centre: bounding centroid sits at (OX/2,OY/2); subtract so dead-centre.
    const RX = -OX / 2, RY = -OY / 2;

    // 8 corners in figure space. Front F0..F3 (CCW from top-left, depth=1=near),
    // Back B0..B3 (same order, shifted, depth=0=far).
    const frontL = [
      { x: -A + RX, y: -A + RY }, { x:  A + RX, y: -A + RY },
      { x:  A + RX, y:  A + RY }, { x: -A + RX, y:  A + RY },
    ];
    const backL = frontL.map((v) => ({ x: v.x + OX, y: v.y + OY }));

    // ---- seamless in-plane rotation: exactly ONE full turn over the clip ------
    const ang = p * TAU;                               // p:0->1 = 0->360deg : seamless
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const place = (v) => ({
      x: cx + (v.x * ca - v.y * sa),
      y: cy + (v.x * sa + v.y * ca),
    });
    const F = frontL.map(place);   // F[0..3] near corners (screen)
    const B = backL.map(place);    // B[0..3] far  corners (screen)

    // ---- beam (square-section bar) renderer ----------------------------------
    // A beam runs from screen point a->b. We give it width 2*HW and a faux depth
    // by offsetting a "back" rail perpendicular-ish along a fixed light vector,
    // so it looks like a 3-D timber: a TOP face (lightest), the FRONT face (mid)
    // and a side SHADE face (darkest). The bevel offset is constant on screen
    // (it rotates WITH the figure via `rot`) so all beams stay mutually parallel
    // in their shading — reads as one coherent solid object.
    const HW = 30;                                     // half-width of a beam (px)
    // depth/bevel offset direction (toward viewer-down-right), rotates with fig:
    const bevA = ang + 0.62;                           // fixed-in-figure bevel angle
    const bvx = Math.cos(bevA) * 26, bvy = Math.sin(bevA) * 26;

    // three tones for the faux-3D bar (cool steel on black) ---------------------
    const TOPC = 'rgb(150,205,238)';   // lightest (top bevel face)
    const FRNT = 'rgb(96,150,192)';    // mid      (the long front face)
    const SHDE = 'rgb(50,90,128)';     // darkest  (the side shade face)
    const EDGE = 'rgba(232,246,255,0.96)';
    const EDGD = 'rgba(10,22,38,0.95)';

    // unit along & perpendicular of a beam
    const beamFrame = (a, b) => {
      let dx = b.x - a.x, dy = b.y - a.y;
      const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      const px = -dy, py = dx;           // left normal
      return { dx, dy, px, py, L };
    };

    // Fill one quad helper
    const quad = (p0, p1, p2, p3, col) => {
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y);
      ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    };

    // Draw a full faux-3D beam from a->b. `extend` lengthens both ends by HW so
    // beams meet cleanly (mitre) at shared corners. Order of faces: SHADE & TOP
    // (the offset bevel), then FRONT face on top, then crisp outline.
    const drawBeam = (a, b, extend) => {
      const fr = beamFrame(a, b);
      const e = extend ? HW : 0;
      const A0 = { x: a.x - fr.dx * e, y: a.y - fr.dy * e };
      const B0 = { x: b.x + fr.dx * e, y: b.y + fr.dy * e };
      // front face rectangle corners (along the beam axis), width 2*HW
      const f0 = { x: A0.x + fr.px * HW, y: A0.y + fr.py * HW };
      const f1 = { x: B0.x + fr.px * HW, y: B0.y + fr.py * HW };
      const f2 = { x: B0.x - fr.px * HW, y: B0.y - fr.py * HW };
      const f3 = { x: A0.x - fr.px * HW, y: A0.y - fr.py * HW };
      // back rail = front face shifted by the bevel vector (the depth)
      const g0 = { x: f0.x + bvx, y: f0.y + bvy };
      const g1 = { x: f1.x + bvx, y: f1.y + bvy };
      const g2 = { x: f2.x + bvx, y: f2.y + bvy };
      const g3 = { x: f3.x + bvx, y: f3.y + bvy };
      // The bevel faces (drawn first, behind the front face):
      //   "top"  side: edge f0-f1 extruded to g0-g1
      //   "shade" side: edge f2-f3 extruded to g2-g3
      quad(f3, f2, g2, g3, SHDE);   // one long side (shade)
      quad(f0, f1, g1, g0, TOPC);   // other long side (lit top)
      quad(f1, f2, g2, g1, SHDE);   // end cap shade
      quad(f3, f0, g0, g3, TOPC);   // end cap lit
      // front face on top
      quad(f0, f1, f2, f3, FRNT);
      // crisp outline of the front face
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.lineWidth = 3.0; ctx.strokeStyle = EDGE;
      ctx.beginPath();
      ctx.moveTo(f0.x, f0.y); ctx.lineTo(f1.x, f1.y);
      ctx.lineTo(f2.x, f2.y); ctx.lineTo(f3.x, f3.y);
      ctx.closePath(); ctx.stroke();
      // thin dark line along the bevel join for crispness
      ctx.lineWidth = 1.6; ctx.strokeStyle = EDGD;
      ctx.beginPath(); ctx.moveTo(f0.x, f0.y); ctx.lineTo(f1.x, f1.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(f3.x, f3.y); ctx.lineTo(f2.x, f2.y); ctx.stroke();
    };

    // ---- 12 beams as (a,b) screen-point pairs --------------------------------
    // index map: front F0..3 (near, CCW from top-left), back B0..3 (far, shifted).
    // In screen space exactly TWO interior crossings exist (verified numerically):
    //     fTop (F0-F1)  crosses  bLeft (B3-B0)
    //     fRight(F1-F2) crosses  bBot  (B2-B3)
    // Normally the FRONT edge wins both. To make the cube impossible we invert
    // ONE of them: we let the back-left strut (bLeft) pass IN FRONT of the
    // front-top edge (fTop) — a far edge occluding a near edge. Everything else
    // is painted in honest far->near order, so every OTHER junction looks normal;
    // only that single woven crossing is impossible (classic Escher cube).
    const BEAMS = {
      // back square (far)
      bTop: [B[0], B[1]], bRight: [B[1], B[2]], bBot: [B[2], B[3]], bLeft: [B[3], B[0]],
      // connectors (front<->back)
      cTL: [F[0], B[0]], cTR: [F[1], B[1]], cBR: [F[2], B[2]], cBL: [F[3], B[3]],
      // front square (near)
      fTop: [F[0], F[1]], fRight: [F[1], F[2]], fBot: [F[2], F[3]], fLeft: [F[3], F[0]],
    };

    // soft cool glow backing so the solid figure sits richly on pure black
    ctx.save();
    const halo = ctx.createRadialGradient(cx, cy, 60, cx, cy, 540);
    halo.addColorStop(0, 'rgba(40,90,150,0.30)');
    halo.addColorStop(0.62, 'rgba(20,50,90,0.14)');
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, 540, 0, TAU); ctx.fill();
    ctx.restore();

    ctx.save();
    // PAINTER'S ORDER (honest far -> near), with ONE inversion at the end.
    // Honest order: back square -> connectors -> front square. We deliberately
    // DEFER bLeft (back-left strut) out of the back-square group and draw it
    // DEAD LAST, on top of the front square. Result: at its crossing with the
    // front-top edge fTop, this far strut occludes the near edge -> the single
    // impossible weave. (Its junctions with the genuinely-behind back beams stay
    // visually fine because they merely share corners; the only NON-adjacent
    // crossing it has on screen is with fTop, which is exactly the trick.)
    const ORDER = [
      // back square minus the deferred strut (still farthest)
      'bTop', 'bRight', 'bBot',
      // connectors
      'cTL', 'cTR', 'cBR', 'cBL',
      // front square (near)
      'fTop', 'fRight', 'fBot', 'fLeft',
    ];
    for (const k of ORDER) drawBeam(BEAMS[k][0], BEAMS[k][1], true);
    // THE IMPOSSIBLE CROSSING: back-left strut drawn last -> in front of fTop.
    drawBeam(BEAMS.bLeft[0], BEAMS.bLeft[1], true);
    ctx.restore();

    void H.rng; void EDGE; void lerp; void clamp; void smooth;
  }
  // ===========================================================================

  // ---------------- title (identical layout to v1; drawn as overlay or inline) ----------
  let TITLE_LINES = [], TITLE_PX = 60, TITLE_TEXT = '';
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    TITLE_TEXT = String(text || '');
    const words = TITLE_TEXT.trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function paintTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.64, 'rgba(0,0,0,0.12)'); g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') {
      const { variant, ...rest } = overrides;
      SPEC = { ...SPEC, ...rest };
      if (variant && typeof variant === 'object') SPEC.variant = variant;
    }
    V = { palette: 'classic', dir: 1, turns: 1, speed: 1, seed: 1, density: 1, angle: 0, ...(SPEC.variant || {}) };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, light: !!SPEC.light, variant: V, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC, v: { ...V } }; };

  // Full frame (background + illusion + vignette + INLINE title). Used for standalone preview.
  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    paintTitle();
    return canvas.toDataURL('image/png');
  };
  // Geometry only, NO title (opaque). Rendered ONCE; localized titles overlaid later.
  window.renderBase = function (progress) {
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    return canvas.toDataURL('image/png');
  };
  // TRANSPARENT png with ONLY the title (pill + text), for ffmpeg overlay onto a titleless clip.
  window.renderTitle = function (text) {
    layoutTitle(text);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, CW, CH);
    paintTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
