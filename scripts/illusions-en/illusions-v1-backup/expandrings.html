<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'expandrings',
    name: 'Expanding-rings aftereffect',
    title: 'Stare at the center, then look around',
    dur: 9,            // seconds
    fps: 30,
    light: false,      // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const TAU = H.TAU;
    const cx = H.cx;
    // Centre the figure on the vertical midline of the safe box (~950), so the
    // outermost rings never reach the title above or the bottom clear zone.
    const cy = (H.safe.y0 + H.safe.y1) / 2;            // ~950

    // EXPANDING-RINGS motion aftereffect.
    // Rings are born tiny at the centre and grow OUTWARD, fading in at birth and
    // fading out at the rim, giving a hypnotic continuous zoom. Radii grow
    // EXPONENTIALLY with phase, so adjacent rings keep a constant size ratio:
    // that self-similarity is what makes the loop seamless — over p:0->1 every
    // ring's phase advances by exactly one ring-spacing, so the whole set lands
    // exactly on the next ring's old place -> draw(0) === draw(1).
    // Normalise progress so p=1 maps EXACTLY to p=0 (bit-identical) — guarantees
    // draw(0) === draw(1) without IEEE754 drift from ((i/K)+1)%1 !== (i/K).
    const pp = p - Math.floor(p);                      // in [0,1); pp(1.0)===pp(0.0)===0

    const rMin = 14;                                   // birth radius at the centre
    const rMax = 452;                                  // death radius at the rim (inside safe)
    const K = 11;                                      // number of live rings (one period = 1/K)
    const ratio = rMax / rMin;                         // total scale span
    const logSpan = Math.log(ratio);

    // soft dark backing disc so the bright rings read crisply against the frame
    ctx.save();
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rMax + 40);
    bg.addColorStop(0, 'rgba(10,12,20,0.96)');
    bg.addColorStop(0.78, 'rgba(6,7,12,0.94)');
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(cx, cy, rMax + 40, 0, TAU); ctx.fill();
    ctx.restore();

    // --- the expanding rings -------------------------------------------------
    ctx.save();
    ctx.lineCap = 'round';
    for (let i = 0; i < K; i++) {
      // phase 0 -> born at centre, phase 1 -> dies at rim. Evenly staggered, all
      // advancing together with p; mod-1 rebirth happens at a different p per ring
      // so the cycle is continuous (no global flash).
      const phase = ((i / K) + pp) % 1;
      // exponential radius growth (perspective zoom; constant adjacent ratio)
      const r = rMin * Math.exp(logSpan * phase);
      // stroke thickness grows with the ring so spacing stays visually balanced
      const lw = lerp(4, 26, phase);
      // fade in over the first slice, hold, fade out over the last slice
      const fadeIn = smooth(phase / 0.16);
      const fadeOut = smooth((1 - phase) / 0.16);
      const a = 0.95 * fadeIn * fadeOut;
      if (a <= 0.001) continue;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.strokeStyle = `rgba(150,210,255,${a})`;
      ctx.lineWidth = lw;
      ctx.shadowColor = `rgba(90,170,255,${0.55 * a})`;
      ctx.shadowBlur = 16;
      ctx.stroke();
      // bright inner core line for extra crispness / contrast against black
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.strokeStyle = `rgba(238,248,255,${a})`;
      ctx.lineWidth = Math.max(2, lw * 0.34);
      ctx.shadowBlur = 0;
      ctx.stroke();
    }
    ctx.restore();

    // --- central fixation dot (FIXED — never moves/expands; the anchor) ------
    ctx.save();
    // small dark halo to seat the dot over the innermost bright ring
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.beginPath(); ctx.arc(cx, cy, 16, 0, TAU); ctx.fill();
    ctx.shadowColor = 'rgba(255,210,120,0.9)';
    ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(255,196,70,1)';
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,244,210,1)';
    ctx.beginPath(); ctx.arc(cx - 2, cy - 2, 3.4, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
