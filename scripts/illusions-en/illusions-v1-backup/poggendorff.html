<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'poggendorff',
    name: 'Poggendorff illusion',
    title: 'It is one straight line behind the bar',
    dur: 8,            // seconds
    fps: 30,
    light: false,      // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    // --- Poggendorff illusion -------------------------------------------------
    // ONE perfectly straight oblique line (y = m*x + b) runs across the frame, but
    // a thick vertical bar covers its middle. We only draw the line OUTSIDE the
    // bar: a left segment ending at the bar's left edge and a right segment
    // starting at the bar's right edge. The two visible segments are exactly
    // collinear, yet the bar makes the right segment look as if it sits too LOW
    // (mis-aligned) — the Poggendorff effect.
    // Once per loop the bar slides sideways (to the RIGHT, off-frame) out of the
    // way, uncovering the full line so you can see the two halves are truly one
    // straight stroke; then it slides back. Sliding horizontally keeps the bar
    // inside the vertical safe band the whole time (never enters the bottom UI
    // strip). The bar's rest position is identical at p=0 and p=1 -> seamless loop.
    const S = H.safe;
    const cx = H.cx;                       // 540 — horizontal centre

    // --- the single straight oblique line ----------------------------------
    // A shallow-ish diagonal gives the strongest Poggendorff offset. Define it by
    // two anchor points well inside the safe band; everything else derives from
    // the exact line equation so the segments are guaranteed collinear.
    const yMid = 960;                      // line passes through frame centre height
    const slopeDeg = 24;                   // obliquity (deg below horizontal, L->R down)
    const m = Math.tan(slopeDeg * Math.PI / 180);
    // y(x) = yMid + m * (x - cx)
    const lineY = (x) => yMid + m * (x - cx);

    // visible horizontal extent of the whole line
    const xLineL = S.x0 + 40;              // 110
    const xLineR = S.x1 - 40;              // 970
    // vertical extent check: at x=110 -> 960 - m*430; at x=970 -> 960 + m*430.
    // m=tan24~0.445 -> span ~191px each side -> y in 769..1151, inside 380..1520.

    // --- the thick vertical bar --------------------------------------------
    const barW = 250;                      // thick rectangle width
    const barL = cx - barW / 2;            // 415
    const barR = cx + barW / 2;            // 665
    const barTop = 560;                    // tall bar inside the safe band
    const barBot = 1360;                   // height 800px; well clear of bottom 400px UI

    // --- once-per-loop reveal: bar slides RIGHT off-frame, then back -------
    // shift = 0 at p=0 and p=1; rises to a full clear in the middle of the clip.
    // We move the bar to the right by up to `slide` px so its left edge clears the
    // line's right end (xLineR=970) and the whole line is exposed.
    const slide = 760;                     // barL 415 -> 1175 (> xLineR) => line fully clear
    let shift = 0;
    {
      // smooth bump centred on p=0.5, zero at the ends (seamless).
      // window [0.32, 0.68]; outside it the bar fully covers the line's middle.
      const a = 0.32, b = 0.68;
      if (p > a && p < b) {
        const t = (p - a) / (b - a);       // 0..1 across the window
        shift = Math.sin(t * Math.PI);     // 0 -> 1 -> 0 smooth
      }
    }
    const barDX = Math.round(slide * shift);
    // "covered" = the bar's left edge still sits left of the line's right end, so
    // part of the line is hidden -> draw it as two gapped segments. Once the bar
    // has slid past xLineR we draw the full uninterrupted line.
    const covered = (barL + barDX) < xLineR;

    const LINE_COL = '#ffd23a';            // warm yellow line, pops on dark + on the bar
    const BAR_FILL = '#2b3340';            // cool slate bar
    const BAR_EDGE = 'rgba(150,168,190,0.9)';

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 1) THE FULL straight line is ALWAYS drawn first as ONE uninterrupted
    //    stroke. The OPAQUE bar is then painted over it (step 2). So while the bar
    //    sits in the middle the line reads as two offset segments (Poggendorff);
    //    once the bar slides away the same single stroke is fully exposed, proving
    //    it was straight all along. No segment maths -> the halves can never drift.
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';   // dark halo under the line for crispness
    ctx.lineWidth = 20;
    ctx.beginPath();
    ctx.moveTo(xLineL, lineY(xLineL));
    ctx.lineTo(xLineR, lineY(xLineR));
    ctx.stroke();
    ctx.strokeStyle = LINE_COL;
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(xLineL, lineY(xLineL));
    ctx.lineTo(xLineR, lineY(xLineR));
    ctx.stroke();

    // 2) THE BAR — opaque slate rectangle, painted over the line at its current
    //    horizontal position (barDX). Its left/right edges are exactly vertical.
    const bL = barL + barDX, bR = barR + barDX;
    ctx.beginPath();
    ctx.rect(bL, barTop, barW, barBot - barTop);
    ctx.fillStyle = BAR_FILL;
    ctx.fill();
    // subtle vertical sheen so the rectangle reads as a solid 3-D bar
    const sheen = ctx.createLinearGradient(bL, 0, bR, 0);
    sheen.addColorStop(0, 'rgba(255,255,255,0.10)');
    sheen.addColorStop(0.5, 'rgba(255,255,255,0.02)');
    sheen.addColorStop(1, 'rgba(0,0,0,0.18)');
    ctx.fillStyle = sheen;
    ctx.fillRect(bL, barTop, barW, barBot - barTop);
    // crisp edges
    ctx.lineWidth = 3;
    ctx.strokeStyle = BAR_EDGE;
    ctx.strokeRect(bL, barTop, barW, barBot - barTop);

    // 3) Faint guide DOTS exactly where the true line meets the bar's two vertical
    //    edges — shown only at rest (illusion frame). They sit ON the single line,
    //    so when the bar later clears you can see those two contact points really
    //    were collinear. They fade out the instant the bar starts to move.
    if (covered && barDX < 6) {
      const gA = 0.95;
      for (const x of [barL, barR]) {
        ctx.beginPath();
        ctx.arc(x, lineY(x), 7, 0, TAU);
        ctx.fillStyle = `rgba(255,210,58,${gA})`;
        ctx.fill();
      }
    }

    void H.rng; // deterministic geometry; no randomness needed
    ctx.restore();
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
