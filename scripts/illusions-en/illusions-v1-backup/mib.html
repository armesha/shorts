<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'mib',
    name: 'Motion-induced blindness',
    title: 'Stare at the centre — the yellow dots vanish',
    dur: 9,            // seconds
    fps: 30,
    light: false,      // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    // -- Motion-induced blindness (Bonneh 2001) -----------------------------
    // A large field of small BLUE crosses SLOWLY ROTATES about the centre.
    // Three bright static YELLOW dots (triangle around the centre) + a white
    // fixation dot stay put.  Fixating the centre makes the yellow targets
    // intermittently disappear (the global rotary motion of the blue mask
    // suppresses the salient static targets).
    //
    // NOTE on geometry: the crosses sit on CONCENTRIC RINGS (a polar lattice),
    // not a square grid.  A square grid of 4-fold "+" crosses maps onto itself
    // every 90deg, so a whole-turn rotation looks frozen at p=0,.25,.5,.75.  A
    // ring layout (with ring-dependent counts/phase) rotates with unmistakable,
    // coherent global motion while a whole turn is still perfectly seamless.
    const cx = H.cx, cy = H.cy;

    // Pitch black field behind everything (MIB lives on black).
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);

    // --- limit everything to a disc that fits the safe box --------------------
    // Safe box half-extents: horizontal 470, vertical 570 -> 470 is the limit.
    const ARM = 12;            // half-length of a cross arm
    const THICK = 5;           // cross arm thickness
    const FIELD_R = 446;       // outer ring radius of the rotating blue field
    const MASK_R = FIELD_R + ARM + 6; // clip radius so arms never clip the safe box

    // --- seamless whole-turn rotation of the blue mask -----------------------
    // TURNS full turns over the loop -> draw(0) === draw(1).  ONE slow turn over
    // 9 s reads as a gentle, steady rotary drift (the MIB-inducing global motion).
    // Wrap p into [0,1) FIRST so p=1 feeds the SAME angle as p=0 bit-for-bit
    // (p*TAU vs p*TAU+TAU are not IEEE-identical -> would change anti-aliasing).
    const TURNS = 1;
    const pw = p - Math.floor(p);   // p=1 -> 0, identical frame to p=0
    const ang = pw * TAU * TURNS;

    const BLUE = 'rgb(80,160,255)';         // medium blue (clearly < yellow luminance)

    ctx.save();
    // hard-clip to the disc so nothing pokes past the safe box while rotating
    ctx.beginPath();
    ctx.arc(cx, cy, MASK_R, 0, TAU);
    ctx.clip();
    ctx.strokeStyle = BLUE;
    ctx.lineWidth = THICK;
    ctx.lineCap = 'round';

    // helper: draw one rotated "+" cross centred at (x,y), arms along screen axes
    const drawCross = (x, y) => {
      ctx.beginPath();
      ctx.moveTo(x - ARM, y); ctx.lineTo(x + ARM, y); // horizontal bar
      ctx.moveTo(x, y - ARM); ctx.lineTo(x, y + ARM); // vertical bar
      ctx.stroke();
    };

    // --- build the blue field as concentric rings of crosses ------------------
    // Ring pitch ~58px; per-ring count keeps roughly even angular density.
    // A small per-ring phase offset (and a centre cross is skipped) breaks any
    // residual symmetry so the rotation always reads clearly.
    const RING_PITCH = 58;
    const nRings = Math.floor(FIELD_R / RING_PITCH); // ~7 rings
    for (let ri = 1; ri <= nRings; ri++) {
      const r = ri * RING_PITCH;
      // ~one cross per ~60px of circumference, min 6
      const count = Math.max(6, Math.round((TAU * r) / 60));
      const phase = ang + ri * 0.37;       // per-ring twist so motion is unmistakable
      for (let k = 0; k < count; k++) {
        const a = phase + (k / count) * TAU;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        drawCross(x, y);
      }
    }
    ctx.restore();

    // --- 3 static bright YELLOW target dots (triangle around the centre) -----
    // These DO NOT move.  They are the targets that perceptually vanish while
    // you fixate the centre.  Radius small enough to keep them well clear of the
    // blue field's outer edge yet large + bright so they're salient.
    const TARGET_R = 168;      // distance of each yellow dot from centre
    const DOT = 17;            // yellow dot radius
    const YELLOW = 'rgb(255,221,40)';
    // upward-pointing triangle: top, lower-right, lower-left
    const angs = [-Math.PI / 2, Math.PI / 6, (5 * Math.PI) / 6];
    for (const a of angs) {
      const x = cx + Math.cos(a) * TARGET_R;
      const y = cy + Math.sin(a) * TARGET_R;
      // deterministic radial halo (NOT shadowBlur — Skia's blur is not
      // bit-stable between draw calls and was breaking the loop seam).
      const g = ctx.createRadialGradient(x, y, DOT * 0.6, x, y, DOT * 2.2);
      g.addColorStop(0, 'rgba(255,221,40,0.55)');
      g.addColorStop(1, 'rgba(255,221,40,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, DOT * 2.2, 0, TAU);
      ctx.fill();
      // solid bright core
      ctx.fillStyle = YELLOW;
      ctx.beginPath();
      ctx.arc(x, y, DOT, 0, TAU);
      ctx.fill();
    }

    // --- central WHITE fixation dot ------------------------------------------
    ctx.fillStyle = 'rgb(255,255,255)';
    ctx.beginPath();
    ctx.arc(cx, cy, 9, 0, TAU);
    ctx.fill();

    void H.rng; // deterministic lattice + fixed targets; no randomness needed
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
