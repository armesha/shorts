<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'wundt',
    name: 'Wundt illusion',
    title: 'These two red lines are perfectly straight',
    dur: 8,            // seconds
    fps: 30,
    light: false,      // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const S = H.safe;
    // ---- Wundt illusion (inverse Hering) ----------------------------------
    // A radial FAN whose lines converge on TWO apexes that sit on the vertical
    // centre-line, one ABOVE the figure and one BELOW it. Over that fan we draw
    // two truly straight, parallel, VERTICAL red lines (one left, one right of
    // centre). Because each apex is OUTSIDE the span of the red lines, the fan
    // lines graze each red line at an ACUTE angle near its MIDDLE and cross it
    // near-perpendicular at its ENDS — the exact opposite arrangement to Hering
    // (whose single apex sits between the lines, bowing them OUTWARD). Here the
    // angle-contrast pinches each line's waist INWARD: the pair looks bowed
    // toward each other though both are mathematically straight.
    const cx = Math.round((S.x0 + S.x1) / 2); // 540, shared horizontal centre

    // Vertical extent of the whole figure (fan + lines) inside the safe band.
    const yTop = 560;          // top of red lines / inner reach of fan
    const yBot = 1400;         // bottom of red lines  (560..1400 well inside 380..1520)
    const cy = Math.round((yTop + yBot) / 2); // 980

    // Two apexes ON the centre-line, just OUTSIDE the red-line span. Sitting
    // outside the span is what flips Hering -> Wundt (inward instead of outward):
    // each apex's rays graze the red lines at an ACUTE angle near the figure's
    // waist and cross near-perpendicular at the ends -> the waist looks pinched.
    const apexTop = { x: cx, y: yTop - 56 };  // (540, 504)
    const apexBot = { x: cx, y: yBot + 56 };  // (540, 1456)

    // Two parallel vertical red lines, symmetric about the centre. Kept fairly
    // close together so the inward "pinch" at the waist reads strongly.
    const half = 130;                          // x-offset of each line from centre
    const xL = cx - half, xR = cx + half;      // 410 and 670

    ctx.save();
    // Clip strictly to the safe box so no fan ray ever bleeds into the title row
    // or the bottom 400px UI strip.
    ctx.beginPath();
    ctx.rect(S.x0, S.y0, S.x1 - S.x0, S.y1 - S.y0);
    ctx.clip();

    // --- the inducing fan ---------------------------------------------------
    // Equal-angle rays from each apex, light grey on black so the bright red
    // test lines clearly sit on TOP of the texture (contrast = the cue here).
    const FAN = 22;                  // rays per apex on each fanned side (denser = stronger cue)
    const SPREAD = Math.PI * 0.49;   // half-angle the fan opens to (~88deg span)
    const RAY = 1080;                // ray length (long enough to span the clip)
    ctx.strokeStyle = 'rgba(150,158,170,0.85)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'butt';

    const fanFrom = (apex, baseDir) => {
      // baseDir: +1 -> fan opens DOWNWARD (apex above), -1 -> opens UPWARD.
      for (let i = -FAN; i <= FAN; i++) {
        const a = (i / FAN) * SPREAD;          // angle off the vertical axis
        // direction vector: vertical (baseDir) rotated by a about the apex.
        const dx = Math.sin(a);
        const dy = baseDir * Math.cos(a);
        ctx.beginPath();
        ctx.moveTo(apex.x, apex.y);
        ctx.lineTo(apex.x + dx * RAY, apex.y + dy * RAY);
        ctx.stroke();
      }
    };
    fanFrom(apexTop, +1);   // rays spray DOWN from the top apex
    fanFrom(apexBot, -1);   // rays spray UP from the bottom apex

    // --- the two STRAIGHT red lines (drawn on top of the fan) ---------------
    // These are literal vertical strokes — provably straight. Bright saturated
    // red reads strongly over the grey fan and the dark vignette.
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgb(255,52,52)';
    ctx.lineWidth = 11;
    for (const x of [xL, xR]) {
      ctx.beginPath();
      ctx.moveTo(x, yTop);
      ctx.lineTo(x, yBot);
      ctx.stroke();
    }

    ctx.restore();

    // --- once-per-loop PROOF reveal -----------------------------------------
    // Fade in two perfectly-vertical dashed reference rails laid exactly over
    // the red lines, proving they never deviate. sin bump => 0 at p=0 and p=1
    // so the loop stays seamless (draw(0) === draw(1)); the fan + red lines are
    // static, so only this overlay animates.
    let reveal = 0;
    if (p > 0.30 && p < 0.70) {
      const t = (p - 0.30) / 0.40;     // 0..1 across the window
      reveal = Math.sin(t * Math.PI);  // 0 -> 1 -> 0 (smooth bump)
    }
    if (reveal > 0.001) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(S.x0, S.y0, S.x1 - S.x0, S.y1 - S.y0);
      ctx.clip();
      ctx.setLineDash([16, 14]);
      ctx.lineCap = 'butt';
      ctx.lineWidth = 4;
      ctx.strokeStyle = `rgba(120,220,255,${0.95 * reveal})`;
      for (const x of [xL, xR]) {
        ctx.beginPath();
        ctx.moveTo(x, yTop - 18);
        ctx.lineTo(x, yBot + 18);
        ctx.stroke();
      }
      // short horizontal tie-ticks at top & bottom to underline "same x, dead straight"
      ctx.setLineDash([]);
      ctx.lineWidth = 3;
      const tick = 26;
      for (const x of [xL, xR]) {
        for (const y of [yTop, yBot]) {
          ctx.beginPath();
          ctx.moveTo(x - tick, y);
          ctx.lineTo(x + tick, y);
          ctx.stroke();
        }
      }
      // tiny label centred between the lines, kept well inside the safe band
      ctx.fillStyle = `rgba(120,220,255,${0.96 * reveal})`;
      ctx.font = '700 38px "DejaVu Sans","Liberation Sans",Arial,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('straight', cx, cy);
      ctx.restore();
    }

    void H.rng; // deterministic geometry; no randomness needed
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
