<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'wheel',
    name: 'Wagon-wheel effect',
    title: 'Which way is it really spinning?',
    dur: 8,            // seconds
    fps: 30,
    light: false,      // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const TAU = H.TAU;
    const cx = H.cx, cy = H.cy;

    // --- geometry (centred, well inside H.safe vertically) -------------------
    // safe box is y:380..1520 (height 1140) -> centre the wheel on its midline,
    // and size the rim so it never reaches the title or the bottom clear zone.
    const wcy = (H.safe.y0 + H.safe.y1) / 2;        // ~950, vertical centre of figure
    const rimR = 430;                               // outer rim radius (fits 380..1520)
    const spokeOuter = rimR - 14;                   // spokes stop just short of the rim
    const hubR = 46;                                // central hub radius
    const spokeInner = hubR + 6;                    // spokes start just outside the hub

    // --- the stroboscopic rotation -------------------------------------------
    // 13 FULL forward turns over the loop -> at 30fps / 240 frames that is
    // 13*360/240 = 19.5 deg per frame, just under the 20 deg spoke spacing,
    // so the 18-fold-symmetric spoke pattern reads as crawling BACKWARD.
    // 13 (integer turns) x 18 (fold symmetry) => draw(0) === draw(1): seamless.
    const N = 18;                                    // evenly spaced radial spokes
    const yaw = p * TAU * 13;                        // true forward rotation

    // --- soft dark backing disc (so bright spokes read crisply) --------------
    ctx.save();
    const bg = ctx.createRadialGradient(cx, wcy, hubR, cx, wcy, rimR + 30);
    bg.addColorStop(0, 'rgba(24,26,34,0.95)');
    bg.addColorStop(0.82, 'rgba(12,13,18,0.92)');
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(cx, wcy, rimR + 30, 0, TAU); ctx.fill();
    ctx.restore();

    // --- outer rim -----------------------------------------------------------
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(238,242,252,0.96)';
    ctx.lineWidth = 16;
    ctx.shadowColor = 'rgba(150,190,255,0.35)';
    ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(cx, wcy, rimR, 0, TAU); ctx.stroke();
    ctx.restore();

    // --- spokes (bright on black) --------------------------------------------
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = 12;
    ctx.shadowColor = 'rgba(140,180,255,0.30)';
    ctx.shadowBlur = 8;
    for (let i = 0; i < N; i++) {
      const a = yaw + (i / N) * TAU;            // each spoke advances with yaw
      const ca = Math.cos(a), sa = Math.sin(a);
      ctx.strokeStyle = 'rgba(244,247,255,0.97)';
      ctx.beginPath();
      ctx.moveTo(cx + ca * spokeInner, wcy + sa * spokeInner);
      ctx.lineTo(cx + ca * spokeOuter, wcy + sa * spokeOuter);
      ctx.stroke();
    }
    ctx.restore();

    // --- central hub ---------------------------------------------------------
    ctx.save();
    const hg = ctx.createRadialGradient(cx - 12, wcy - 12, 4, cx, wcy, hubR);
    hg.addColorStop(0, 'rgba(250,252,255,1)');
    hg.addColorStop(1, 'rgba(196,206,226,1)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(cx, wcy, hubR, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(120,140,180,0.9)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, wcy, hubR, 0, TAU); ctx.stroke();
    ctx.restore();

    // --- the ONE coloured reference dot on the rim ---------------------------
    // A single unique mark has NO 18-fold ambiguity, so it visibly tracks the
    // TRUE forward rotation -> the careful viewer can confirm the wheel really
    // spins forward even while the spokes seem to crawl backward.
    const dotA = yaw;                            // sits between spoke 0 and 1
    const dotR = rimR;                           // ride exactly on the rim
    const dx = cx + Math.cos(dotA) * dotR;
    const dy = wcy + Math.sin(dotA) * dotR;
    ctx.save();
    // bright halo so it stays unmistakable against the white rim
    ctx.shadowColor = 'rgba(255,120,40,0.9)';
    ctx.shadowBlur = 22;
    ctx.fillStyle = 'rgba(255,170,40,1)';
    ctx.beginPath(); ctx.arc(dx, dy, 22, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,90,30,1)';
    ctx.beginPath(); ctx.arc(dx, dy, 13, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,236,200,1)';
    ctx.beginPath(); ctx.arc(dx - 3, dy - 3, 4.5, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
