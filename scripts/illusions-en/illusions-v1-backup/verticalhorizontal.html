<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'verticalhorizontal',
    name: 'Vertical–horizontal illusion',
    title: 'Both lines are the same length',
    dur: 8,            // seconds
    fps: 30,
    light: false,      // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const S = H.safe;
    // ---- Vertical–horizontal illusion (inverted-T) ------------------------
    // A horizontal bar with a vertical bar standing up from its MIDDLE (a T).
    // Both segments are EXACTLY the same length (LEN), yet the vertical looks
    // distinctly longer — partly the V/H over-estimation, partly because the
    // vertical bisects the horizontal. Once per loop a faint GHOST copy of the
    // vertical rotates 90deg and slides flat, re-centred just above the
    // horizontal, so the eye sees the two equal lengths side by side. The
    // ghost fades in then out (reveal: 0 -> 1 -> 0) so draw(0)===draw(1).
    // White on black.

    const cx = Math.round((S.x0 + S.x1) / 2);   // 540, shared horizontal centre
    const LEN = 600;                             // identical length of BOTH segments
    const HALF = LEN / 2;                        // 300

    // Horizontal bar: centred at cx, sitting in the lower-middle of the band.
    const yH = 1300;                             // <= y1(1520) - clearance
    const xL = cx - HALF, xR = cx + HALF;        // 240 .. 840  (inside x0..x1)

    // Vertical bar: stands UP from the centre of the horizontal (inverted T).
    const xV = cx;                               // 540
    const yVbot = yH;                            // junction sits on the horizontal
    const yVtop = yH - LEN;                       // 700  (> y0 380)

    const WHITE = 'rgb(245,245,245)';
    const LW = 11;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // --- the figure: inverted-T -------------------------------------------
    ctx.strokeStyle = WHITE;
    ctx.lineWidth = LW;
    // horizontal segment
    ctx.beginPath();
    ctx.moveTo(xL, yH);
    ctx.lineTo(xR, yH);
    ctx.stroke();
    // vertical segment (drawn after so the join reads as a crisp T)
    ctx.beginPath();
    ctx.moveTo(xV, yVbot);
    ctx.lineTo(xV, yVtop);
    ctx.stroke();

    // --- once-per-loop PROOF: rotate a ghost of the VERTICAL onto the H ----
    // bump 0 -> 1 -> 0 across a mid window so it is invisible at p=0 and p=1.
    let reveal = 0;
    if (p > 0.22 && p < 0.78) {
      const t = (p - 0.22) / 0.56;          // 0..1 across the window
      reveal = Math.sin(t * Math.PI);       // smooth 0 -> 1 -> 0
    }
    if (reveal > 0.001) {
      // Ease the motion so the ghost holds flat near the peak (clearest moment).
      const m = H.smooth(reveal);           // 0..1..0, eased

      // The ghost is a copy of the vertical segment. We animate two things:
      //   angle:  vertical (up) -> horizontal (pointing right), -90deg
      //   centre: vertical mid -> a flat resting place just ABOVE the H bar,
      //           re-centred on cx so its length is read against the H bar.
      const vMid = { x: xV, y: (yVtop + yVbot) / 2 };       // 540, 1000
      const flatMid = { x: cx, y: yH - 70 };                // 540, 1230 (above H)
      const cxg = lerp(vMid.x, flatMid.x, m);
      const cyg = lerp(vMid.y, flatMid.y, m);
      // start angle: pointing UP = -90deg; end angle: pointing RIGHT = 0deg.
      const ang = lerp(-Math.PI / 2, 0, m);
      const ux = Math.cos(ang), uy = Math.sin(ang);          // unit dir of ghost
      const gx0 = cxg - ux * HALF, gy0 = cyg - uy * HALF;
      const gx1 = cxg + ux * HALF, gy1 = cyg + uy * HALF;

      ctx.save();
      // faint cyan ghost bar
      ctx.strokeStyle = `rgba(120,220,255,${0.95 * reveal})`;
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(gx0, gy0);
      ctx.lineTo(gx1, gy1);
      ctx.stroke();
      // end caps perpendicular to the ghost so its length reads unambiguously
      ctx.lineCap = 'butt';
      ctx.lineWidth = 4;
      const px = -uy, py = ux;            // perpendicular unit
      const capH = 26;
      for (const [ex, ey] of [[gx0, gy0], [gx1, gy1]]) {
        ctx.beginPath();
        ctx.moveTo(ex - px * capH, ey - py * capH);
        ctx.lineTo(ex + px * capH, ey + py * capH);
        ctx.stroke();
      }

      // When (nearly) flat, drop guide lines from the ghost's ends straight
      // down to the horizontal bar's ends, so the eye locks the equal width.
      if (m > 0.6) {
        const g = (m - 0.6) / 0.4;        // 0..1 only near the flat hold
        ctx.setLineDash([10, 9]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = `rgba(120,220,255,${0.5 * reveal * g})`;
        // ghost ends are ~ (xL, flatY) and (xR, flatY) when flat
        ctx.beginPath(); ctx.moveTo(gx0, gy0); ctx.lineTo(xL, yH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(gx1, gy1); ctx.lineTo(xR, yH); ctx.stroke();
        ctx.setLineDash([]);
        // "equal" label above the flat ghost
        ctx.fillStyle = `rgba(120,220,255,${0.95 * reveal * g})`;
        ctx.font = '700 42px "DejaVu Sans","Liberation Sans",Arial,sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('equal', cx, cyg - 50);
      }
      ctx.restore();
    }

    void H.rng; // deterministic geometry; no randomness needed
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
