<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'pinna',
    name: 'Pinna rotating illusion',
    title: 'Lean in and out — the rings rotate',
    dur: 8,            // seconds
    fps: 30,
    light: false,      // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    // --- Pinna–Brelstaff "rotating rings" --------------------------------------
    // Concentric rings of small TILTED white squares on black. Within each ring
    // every square is rotated to the SAME oblique angle relative to the local
    // circle tangent; ADJACENT rings tilt the OPPOSITE way (ring 0 leans CW,
    // ring 1 CCW, ...). The whole figure does NOT spin — it only gently zooms
    // (scale oscillates as a sin over the loop). That radial expand/contract
    // sweeps each tilted square's edges, and because the obliquity reverses ring
    // to ring the motion signals point in OPPOSITE tangential directions, so the
    // rings look like they COUNTER-ROTATE. Stare at the centre dot for the effect.
    const cx = H.cx, cy = H.cy;
    const TAU = H.TAU;

    // Seamless zoom: 2 FULL sin periods over p=0..1 so draw(0) === draw(1).
    // amp is kept small; at the peak the outermost square must stay inside the
    // safe box (tightest side is horizontal: 470px from centre to x0/x1).
    const amp = 0.085;
    const scale = 1 + amp * Math.sin(p * TAU * 2);

    // Ring geometry (BASE radii, before the zoom multiplies them). 5 rings.
    //   peak outer reach = (outerR + sqHalfDiag) * (1 + amp)
    //     = (372 + ~26) * 1.085 ~= 432px  < 470px  -> fits every side, no clip.
    const NRINGS = 5;
    const innerR = 116;        // first ring radius (fixation dot sits inside)
    const ringStep = 64;       // radial gap between successive ring centres
    const sqSize = 34;         // square side length (px), before zoom
    const tiltDeg = 30;        // obliquity of each square vs the local tangent
    const tilt = tiltDeg * Math.PI / 180;

    ctx.save();
    // Clip strictly to the safe box so nothing ever bleeds into the title row
    // or the bottom 400px UI strip, even at the peak of the zoom.
    ctx.beginPath();
    ctx.rect(H.safe.x0, H.safe.y0, H.safe.x1 - H.safe.x0, H.safe.y1 - H.safe.y0);
    ctx.clip();

    // OUTLINED squares (white stroke, black interior): the four crisp edges make
    // each square's oblique ORIENTATION salient, which is what the Pinna motion
    // signal feeds on — solid blobs would wash that edge cue out.
    ctx.lineJoin = 'miter';
    ctx.strokeStyle = '#ffffff';

    for (let ring = 0; ring < NRINGS; ring++) {
      const baseR = innerR + ring * ringStep;
      const r = baseR * scale;                  // zoomed radius for this ring
      const s = sqSize * scale;                 // squares zoom with the figure
      const half = s / 2;
      ctx.lineWidth = 5 * scale;                // stroke thickens with the zoom

      // Obliquity sign flips every ring -> neighbouring rings counter-rotate.
      const dir = (ring % 2 === 0) ? 1 : -1;

      // Keep arc-spacing between squares roughly constant across rings by scaling
      // the count with circumference (more squares on the bigger outer rings).
      const count = Math.max(14, Math.round((TAU * baseR) / 60));
      const da = TAU / count;

      // A small per-ring angular phase so square seams don't line up radially
      // (looks more like Pinna's staggered tiling). Static -> loop-safe.
      const phase = ring * da * 0.5;

      for (let i = 0; i < count; i++) {
        const a = phase + i * da;               // angular position on the ring
        const x = cx + r * Math.cos(a);
        const y = cy + r * Math.sin(a);
        // Square orientation = local tangent (a + 90deg) + the ring's oblique tilt.
        const rot = a + Math.PI / 2 + dir * tilt;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.strokeRect(-half, -half, s, s);
        ctx.restore();
      }
    }

    ctx.restore();

    // Central fixation dot (stare here; the counter-rotation is read peripherally).
    ctx.beginPath();
    ctx.arc(cx, cy, 11, 0, TAU);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, TAU);
    ctx.fillStyle = '#000000';
    ctx.fill();
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
