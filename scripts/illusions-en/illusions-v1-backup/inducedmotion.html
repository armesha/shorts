<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'inducedmotion',
    name: 'Induced motion',
    title: 'The center dot is perfectly still',
    dur: 8,            // seconds
    fps: 30,
    light: false,      // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    // --- Duncker "induced motion" --------------------------------------------
    // A small WHITE dot sits EXACTLY at centre and never moves. A big rectangle
    // FRAME (plus a field of faint stars/dust riding WITH it) drifts slowly
    // left<->right. The visual system anchors on the salient surround, so the
    // stationary dot is *perceived* to slide the OPPOSITE way. The only thing
    // actually moving in the file is the frame + its dust; the dot is fixed.
    const cx = H.cx, cy = H.cy;       // 540, 960  — true canvas centre
    const TAU = H.TAU;

    // Frame half-extents. Chosen so that at full horizontal drift the frame
    // and ALL its dust still sit inside H.safe {70..1010, 380..1520}:
    //   x: centre 540 +/- AMP(95) +/- halfW(330) -> [115 .. 965]  (in 70..1010)
    //   y: centre 960 +/- halfH(420)             -> [540 .. 1380]  (in 380..1520)
    const halfW = 330, halfH = 420;
    const AMP = 95;                   // peak horizontal drift of the frame

    // Smooth side-to-side drift, ONE full sine period over the clip so the frame
    // returns exactly to its start -> draw(0) === draw(1) (seamless loop).
    const dx = AMP * Math.sin(p * TAU);

    // ---- faint star/dust field that rides WITH the frame --------------------
    // Deterministic scatter inside the frame's local box. Moving these together
    // with the rectangle makes the surround motion unmistakable (so the induced
    // counter-motion of the static dot reads strongly). Centre is kept clear so
    // dust never crowds / hides the fixation dot.
    ctx.save();
    const rnd = H.rng(70707);
    const NDUST = 150;
    const innerClear = 150;           // keep a circular gap around the dot
    for (let i = 0; i < NDUST; i++) {
      const lx = (rnd() * 2 - 1) * (halfW - 18);   // local x within frame
      const ly = (rnd() * 2 - 1) * (halfH - 18);   // local y within frame
      const a  = 0.18 + rnd() * 0.42;               // per-dust brightness
      const rad = 1.4 + rnd() * 2.1;                // tiny speck
      if (lx * lx + ly * ly < innerClear * innerClear) continue; // skip near dot
      const x = cx + dx + lx;
      const y = cy + ly;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, TAU);
      ctx.fillStyle = 'rgba(150,180,225,' + a.toFixed(3) + ')';
      ctx.fill();
    }
    ctx.restore();

    // ---- the big drifting rectangle FRAME (outline only) --------------------
    const fx = cx + dx - halfW;       // top-left of the frame
    const fy = cy - halfH;
    const fw = halfW * 2, fh = halfH * 2;
    ctx.save();
    // soft outer glow so the cool frame separates cleanly from the dark vignette
    ctx.shadowColor = 'rgba(120,170,255,0.55)';
    ctx.shadowBlur = 22;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(150,195,255,0.92)';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.roundRect(fx, fy, fw, fh, 26);
    ctx.stroke();
    // thin bright inner stroke for crispness
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(225,238,255,0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(fx + 7, fy + 7, fw - 14, fh - 14, 20);
    ctx.stroke();
    // small corner ticks ride with the frame -> extra motion cue at the edges
    const tick = 30;
    ctx.strokeStyle = 'rgba(170,205,255,0.9)';
    ctx.lineWidth = 5;
    const corners = [
      [fx, fy, 1, 1], [fx + fw, fy, -1, 1],
      [fx, fy + fh, 1, -1], [fx + fw, fy + fh, -1, -1],
    ];
    for (const [bx, by, sx, sy] of corners) {
      ctx.beginPath();
      ctx.moveTo(bx + sx * tick, by);
      ctx.lineTo(bx, by);
      ctx.lineTo(bx, by + sy * tick);
      ctx.stroke();
    }
    ctx.restore();

    // ---- the STATIC central dot (never moves) -------------------------------
    // Drawn last and at the exact canvas centre so it is the obvious anchor.
    ctx.save();
    // faint dark disc behind the dot so any passing dust can't dim it
    ctx.beginPath();
    ctx.arc(cx, cy, 26, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fill();
    // bright white dot + glow
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(cx, cy, 17, 0, TAU);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
