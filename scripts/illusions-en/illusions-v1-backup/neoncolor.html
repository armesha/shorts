<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'neoncolor',
    name: 'Neon colour spreading',
    title: 'There is no glowing disc here',
    dur: 8,            // seconds
    fps: 30,
    light: true,       // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const S = H.safe;

    // ---- Neon colour spreading (Varin / van Tuijl configuration) ------------
    // A CONTINUOUS regular grid of thin BLACK lines on pure WHITE (full horizontal
    // and vertical lines, NOT detached plus-signs). There is an invisible central
    // circle: the parts of every grid line that fall INSIDE that circle are
    // recoloured CYAN, the parts outside stay BLACK. Because the lattice is fully
    // connected, the cyan segments form a near-continuous tinted veil inside the
    // disc; the brain "spreads" that cyan across the small enclosed white cells and
    // you vividly see a soft, glowing CYAN DISC floating over the page. The disc is
    // purely illusory: the only cyan ink is on thin grid lines; the cells between
    // them are bare white paper. (Neon spreading is MUCH stronger on a connected
    // grid than on isolated crosses with wide white channels — that earlier version
    // read as a cluster of crosses, not a disc.)
    // ANIMATION: the cyan radius gently breathes over ONE full sine period so the
    // illusory glow seems to pulse. sin(p*TAU) is 0 at p=0 and p=1 -> seamless loop;
    // the grid itself is static, so draw(0) === draw(1).

    const cx = H.cx, cyc = H.cy;
    const BX0 = S.x0, BY0 = S.y0, BX1 = S.x1, BY1 = S.y1;
    const BW = BX1 - BX0, BH = BY1 - BY0;

    const WHITE = 'rgb(255,255,255)';
    const BLACK = 'rgb(20,20,20)';                 // crisp near-black ink

    // Continuous square grid. Small cells + a fatter line weight mean the coloured
    // contour occupies a large share of the disc, so the white cells are narrow
    // enough for the cyan to "spread" and bridge them into one luminous fill.
    const pitch = 62;                              // distance between grid lines (px)
    const lineW = 8;                               // line weight (px) — fat enough to spread

    // Invisible colouring circle, gently breathing. Kept well inside the safe box
    // (cy 960 +/- R stays < 1520, cx 540 +/- R stays inside 70..1010).
    const baseR = 330;                             // mean radius of the cyan region
    const ampR  = 18;                              // small breathing amplitude (px)
    const phase = Math.sin(p * TAU);               // 0 at p=0 & p=1 -> everything loops
    const R = baseR + ampR * phase;

    // Gentle "glow" pulse on the cyan ink itself: a touch lighter/heavier over the
    // loop so the illusory disc seems to breathe in brightness too. Stays a pure,
    // saturated cyan; amplitude is small. (No real fill is added — the disc is only
    // ever in the viewer's brain.)
    const cb = Math.round(200 + 28 * phase);       // green channel ~ 172..228
    const CYAN = `rgb(20,${cb},${Math.min(255, cb + 25)})`;

    ctx.save();
    // Clip strictly to the safe box so nothing spills into the title / bottom UI.
    ctx.beginPath();
    ctx.rect(BX0, BY0, BW, BH);
    ctx.clip();

    // 1) Pure white field.
    ctx.fillStyle = WHITE;
    ctx.fillRect(BX0, BY0, BW, BH);

    ctx.lineCap = 'butt';
    ctx.lineWidth = lineW;

    // Build grid line positions, snapped symmetrically AROUND the frame centre so
    // the cyan circle sits centred on the lattice (looks intentional / balanced).
    // Lines extend a touch beyond the box; the box clip trims them flush.
    const nx = Math.ceil((BW / 2) / pitch) + 1;    // columns each side of centre
    const ny = Math.ceil((BH / 2) / pitch) + 1;    // rows each side of centre
    const xs = [], ys = [];
    for (let i = -nx; i <= nx; i++) xs.push(cx + i * pitch);
    for (let j = -ny; j <= ny; j++) ys.push(cyc + j * pitch);

    // Helper: stroke the WHOLE continuous grid (full-span lines) in current style.
    const strokeGrid = () => {
      ctx.beginPath();
      for (let i = 0; i < xs.length; i++) {
        const x = xs[i];
        if (x < BX0 - lineW || x > BX1 + lineW) continue;
        ctx.moveTo(x, BY0); ctx.lineTo(x, BY1);              // full vertical line
      }
      for (let j = 0; j < ys.length; j++) {
        const y = ys[j];
        if (y < BY0 - lineW || y > BY1 + lineW) continue;
        ctx.moveTo(BX0, y); ctx.lineTo(BX1, y);              // full horizontal line
      }
      ctx.stroke();
    };

    // 2) Whole connected grid in BLACK first.
    ctx.strokeStyle = BLACK;
    strokeGrid();

    // 3) Re-stroke ONLY the part inside the invisible circle, in CYAN. The circular
    //    clip recolours exactly the in-circle line segments, giving a CLEAN circular
    //    boundary (the edge is a true arc through the grid — no ragged half-crosses).
    //    These connected cyan segments are the sole cyan ink; the filled disc you
    //    "see" is the brain spreading that colour across the enclosed white cells.
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cyc, R, 0, TAU);
    ctx.clip();
    ctx.strokeStyle = CYAN;
    strokeGrid();
    ctx.restore();

    ctx.restore();
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
