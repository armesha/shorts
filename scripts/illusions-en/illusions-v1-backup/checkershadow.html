<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'checkershadow',
    name: 'Checker-shadow illusion',
    title: 'A and B are the exact same grey',
    dur: 8,            // seconds
    fps: 30,
    light: true,       // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const S = H.safe;

    // ---- Adelson's checker-shadow ------------------------------------------
    // An 8x8 checkerboard of mid-greys. A LIGHT-pattern square (A, in full light)
    // and a DARK-pattern square (B, inside a cast shadow) are painted with the
    // IDENTICAL grey (rgb 120). Context makes B look much lighter than A even
    // though their pixels are equal. A sliding connector bar of that same grey
    // proves the equality by joining A <-> B with one uniform corridor.

    const N = 8;                       // 8x8 board
    const cell = 116;                  // square cell size (px); 8*116 = 928
    const board = N * cell;            // 928
    const bx = S.x0 + Math.round(((S.x1 - S.x0) - board) / 2);  // centred horizontally
    const by = S.y0 + Math.round(((S.y1 - S.y0) - board) / 2);  // centred vertically

    const DARK = 'rgb(85,85,85)';      // dark checker square
    const LIGHT = 'rgb(175,175,175)';  // light checker square
    const SAME = 'rgb(120,120,120)';   // the shared grey of A, B and the bar
    const SAME_NUM = [120, 120, 120];
    const isLight = (r, c) => ((r + c) % 2) === 0;

    // The two test squares (same row -> horizontal connector). A = light cell,
    // far left, in full light. B = dark cell, far right, inside the shadow.
    const Ar = 4, Ac = 2;              // light cell (4+2 even) -> outside shadow
    const Br = 4, Bc = 7;              // dark cell (4+7 odd)  -> inside shadow

    const cellRect = (r, c) => ({ x: bx + c * cell, y: by + r * cell, w: cell, h: cell });

    // Shadow band: a soft-edged darkening over the RIGHT portion of the board,
    // as if a post/cylinder standing top-right blocks light coming from the left.
    const penA = bx + 4.0 * cell;      // penumbra start (still lit)
    const penB = bx + 4.85 * cell;     // full umbra from here rightward
    const SHADOW_A = 0.46;             // umbra strength (source-over black alpha)

    ctx.save();

    // Neutral field behind the board (covers any rounding gaps), then clip.
    ctx.fillStyle = 'rgb(150,150,150)';
    ctx.fillRect(S.x0, S.y0, S.x1 - S.x0, S.y1 - S.y0);
    ctx.beginPath();
    ctx.rect(S.x0, S.y0, S.x1 - S.x0, S.y1 - S.y0);
    ctx.clip();

    // 1) Checkerboard.
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        ctx.fillStyle = isLight(r, c) ? LIGHT : DARK;
        ctx.fillRect(bx + c * cell, by + r * cell, cell, cell);
      }
    }

    // 2) Soft cast shadow over the right region (clipped to the board so it does
    //    not spill onto the neutral field). Horizontal penumbra gradient.
    ctx.save();
    ctx.beginPath();
    ctx.rect(bx, by, board, board);
    ctx.clip();
    const grad = ctx.createLinearGradient(penA, 0, penB, 0);
    grad.addColorStop(0, 'rgba(20,20,25,0)');
    grad.addColorStop(1, `rgba(20,20,25,${SHADOW_A})`);
    ctx.fillStyle = grad;
    ctx.fillRect(penA, by, board - (penA - bx), board);
    // umbra core to the right of the penumbra
    ctx.fillStyle = `rgba(20,20,25,${SHADOW_A})`;
    ctx.fillRect(penB, by, bx + board - penB, board);
    // faint diagonal soft edge near the top so the shadow reads as 'cast', not painted
    const topGrad = ctx.createLinearGradient(0, by, 0, by + cell * 1.4);
    topGrad.addColorStop(0, 'rgba(20,20,25,0.10)');
    topGrad.addColorStop(1, 'rgba(20,20,25,0)');
    ctx.fillStyle = topGrad;
    ctx.fillRect(penB, by, bx + board - penB, cell * 1.4);
    ctx.restore();

    // 3) Paint A and B with the IDENTICAL grey, ON TOP of the shadow so neither
    //    is altered by the pattern or the shadow -> their RGB is literally equal.
    {
      const a = cellRect(Ar, Ac), b = cellRect(Br, Bc);
      ctx.fillStyle = SAME;
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }

    // 4) The post/cylinder casting the shadow: stands at the top-right of the
    //    board (lit from the left). Drawn above the board, above the test row.
    {
      const postCx = bx + 6.1 * cell;
      const postW = 70;
      const postBottom = by + 1.15 * cell;        // foot rests on the board near the top
      const postTop = by - 0.55 * cell;           // rises just above the board top
      const x0 = postCx - postW / 2, x1 = postCx + postW / 2;
      // soft contact shadow at the foot
      ctx.save();
      const foot = ctx.createRadialGradient(postCx, postBottom, 4, postCx, postBottom, postW * 1.5);
      foot.addColorStop(0, 'rgba(15,15,18,0.40)');
      foot.addColorStop(1, 'rgba(15,15,18,0)');
      ctx.fillStyle = foot;
      ctx.beginPath();
      ctx.ellipse(postCx, postBottom, postW * 1.5, postW * 0.55, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
      // body with a left-lit cylindrical gradient
      const cylGrad = ctx.createLinearGradient(x0, 0, x1, 0);
      cylGrad.addColorStop(0.00, 'rgb(150,150,156)');
      cylGrad.addColorStop(0.35, 'rgb(196,196,200)');
      cylGrad.addColorStop(1.00, 'rgb(70,70,78)');
      ctx.fillStyle = cylGrad;
      ctx.beginPath();
      ctx.moveTo(x0, postTop);
      ctx.lineTo(x1, postTop);
      ctx.lineTo(x1, postBottom);
      ctx.lineTo(x0, postBottom);
      ctx.closePath();
      ctx.fill();
      // rounded top cap (ellipse) so it reads as a 3D cylinder
      ctx.fillStyle = 'rgb(176,176,182)';
      ctx.beginPath();
      ctx.ellipse(postCx, postTop, postW / 2, 13, 0, 0, TAU);
      ctx.fill();
    }

    // 5) Connector bar of the SAME grey: a one-cell-tall corridor that grows OUT
    //    from A toward B (p 0..0.5) and retracts BACK (0.5..1). Triangle wave on p
    //    makes draw(0)===draw(1): at t=0 the bar is exactly A's cell (no change).
    {
      const tri = p < 0.5 ? p * 2 : 2 - p * 2;     // 0 -> 1 -> 0
      const t = smooth(tri);
      const a = cellRect(Ar, Ac), b = cellRect(Br, Bc);
      const leftX = a.x;                            // bar starts at A's left edge
      const rightFull = b.x + b.w;                  // fully connects through B
      const rightX = lerp(a.x + a.w, rightFull, t); // grows from A's right edge
      const y = a.y, h = a.h;
      ctx.fillStyle = SAME;
      ctx.fillRect(leftX, y, rightX - leftX, h);
    }

    ctx.restore();

    // 6) Labels 'A' and 'B' centred on the squares (drawn last so the bar never
    //    hides them). White glyphs with a dark stroke read clean on the grey.
    {
      const a = cellRect(Ar, Ac), b = cellRect(Br, Bc);
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '800 64px "DejaVu Sans","Liberation Sans",Arial,sans-serif';
      ctx.lineWidth = 7;
      ctx.lineJoin = 'round';
      const label = (txt, cr) => {
        const mx = cr.x + cr.w / 2, my = cr.y + cr.h / 2;
        ctx.strokeStyle = 'rgba(20,20,20,0.92)';
        ctx.strokeText(txt, mx, my);
        ctx.fillStyle = 'rgba(255,255,255,0.98)';
        ctx.fillText(txt, mx, my);
      };
      label('A', a);
      label('B', b);
      ctx.restore();
    }

    void SAME_NUM;
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
