<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'colorassimilation',
    name: 'Colour assimilation',
    title: 'Both panels are pure white',
    dur: 8,            // seconds
    fps: 30,
    light: true,       // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const S = H.safe;

    // ---- Colour assimilation (von Bezold spreading) -------------------------
    // The ENTIRE safe box is one flat field of PURE WHITE. Over it we lay a dense
    // lattice of THIN coloured grid lines: SATURATED RED lines on the LEFT half,
    // SATURATED BLUE lines on the RIGHT half (the divide is the frame centre,
    // x=540). Because the lines are thin and packed, the eye does NOT keep the
    // white and the line colour separate -- it ASSIMILATES (spreads / averages)
    // the line hue INTO the enclosed white. So the identical white reads as a
    // pale PINK on the red-lined left and a pale BLUE on the blue-lined right,
    // even though every white cell is pixel-for-pixel rgb(255,255,255).
    //
    // PROOF: once per loop a wide horizontal CORRIDOR of bare white opens across
    // the divide -- a band with NO lines on either side -- joining the two halves
    // by one continuous strip of the real, untinted white. At full opening you
    // plainly see left-white == corridor-white == right-white. A triangle wave on
    // p makes the corridor fully closed at p=0 and p=1, so draw(0) === draw(1)
    // (seamless loop). The line grids themselves are static.

    const BX0 = S.x0, BY0 = S.y0, BX1 = S.x1, BY1 = S.y1;
    const BW = BX1 - BX0, BH = BY1 - BY0;
    const midX = Math.round((BX0 + BX1) / 2);     // the red|blue line divide (==540)

    const WHITE = 'rgb(255,255,255)';             // the single identical test white
    const RED = 'rgb(228,18,18)';                 // saturated red grid lines (left)
    const BLUE = 'rgb(18,40,232)';                // saturated blue grid lines (right)
    const SEAM = 'rgba(120,120,120,0.55)';        // faint neutral divider seam

    ctx.save();

    // Clip everything to the safe box so nothing spills into the title / UI zone.
    ctx.beginPath();
    ctx.rect(BX0, BY0, BW, BH);
    ctx.clip();

    // 1) Fill the ENTIRE box with the one flat pure white.
    ctx.fillStyle = WHITE;
    ctx.fillRect(BX0, BY0, BW, BH);

    // 2) Proof corridor bounds (computed first so the grids leave it line-free).
    //    Centred on the figure row; opens / closes once per loop via a triangle.
    const tri = p < 0.5 ? p * 2 : 2 - p * 2;      // 0 -> 1 -> 0 (one opening per loop)
    const t = smooth(tri);
    const rowCy = Math.round((BY0 + BY1) / 2);    // vertical centre of the figure
    const corMax = 230;                           // corridor height at full open (px)
    const corH = corMax * t;
    const corTop = rowCy - corH / 2;
    const corBot = rowCy + corH / 2;

    // 3) Lay the thin coloured grids. Lines run BOTH ways (a fine plaid) so each
    //    white cell is enclosed on all sides -- assimilation is strongest with a
    //    dense lattice. Left half -> RED lines, right half -> BLUE lines. Each grid
    //    is clipped to its own half AND skips the open corridor band so the proof
    //    strip stays pure white. FINE lattice: spacing 20px, line width 6px -> each
    //    enclosed white cell is only ~14px, surrounded on all sides by colour. Small
    //    enclosed whites are exactly the condition for the hue to SPREAD INTO (not
    //    contrast with) the white, so the field reads tinted pink / blue.
    const gap = 20;
    const lw = 6;

    const drawGrid = (clipX0, clipX1, color) => {
      ctx.save();
      ctx.beginPath();
      ctx.rect(clipX0, BY0, clipX1 - clipX0, BH);
      ctx.clip();
      ctx.fillStyle = color;
      // Vertical lines: split around the open corridor so the proof strip is bare.
      for (let x = clipX0; x <= clipX1; x += gap) {
        if (corH > 1) {
          if (corTop > BY0) ctx.fillRect(x, BY0, lw, corTop - BY0);
          if (corBot < BY1) ctx.fillRect(x, corBot, lw, BY1 - corBot);
        } else {
          ctx.fillRect(x, BY0, lw, BH);
        }
      }
      // Horizontal lines, skipping any line whose band would fall inside the open
      // corridor so the proof strip is unbroken bare white.
      for (let y = BY0; y <= BY1; y += gap) {
        if (corH > 1 && y + lw > corTop && y < corBot) continue;
        ctx.fillRect(clipX0, y, clipX1 - clipX0, lw);
      }
      ctx.restore();
    };

    drawGrid(BX0, midX, RED);     // left half: red lattice  -> white reads PINK
    drawGrid(midX, BX1, BLUE);    // right half: blue lattice -> white reads BLUE

    // 4) A hairline neutral divider down the centre so the two textured fields read
    //    as two distinct patches. Drawn only OUTSIDE the open corridor so the
    //    corridor stays a seamless bare-white bridge.
    if (corH <= 1 || corTop > BY0) {
      ctx.fillStyle = SEAM;
      const segTop = BY0;
      const segBot = corH > 1 ? corTop : BY1;
      if (segBot > segTop) ctx.fillRect(midX - 1, segTop, 2, segBot - segTop);
    }
    if (corH > 1 && corBot < BY1) {
      ctx.fillStyle = SEAM;
      ctx.fillRect(midX - 1, corBot, 2, BY1 - corBot);
    }

    // 5) Re-stamp the bare-white corridor ON TOP, edge to edge, so it is
    //    unmistakably the same white bridging both halves with zero coloured ink.
    if (corH > 1) {
      ctx.fillStyle = WHITE;
      ctx.fillRect(BX0, corTop, BW, corBot - corTop);
    }

    ctx.restore();
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
