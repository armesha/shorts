<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'whiteillusion',
    name: "White's illusion",
    title: 'These two grey bars are the same grey',
    dur: 8,            // seconds
    fps: 30,
    light: true,       // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const S = H.safe;

    // ---- White's illusion ---------------------------------------------------
    // A square-wave grating of vertical BLACK & WHITE stripes fills the safe box.
    // Two grey rectangles, each EXACTLY one stripe wide, are embedded in the
    // grating: the LEFT patch lies on a BLACK stripe (so its long vertical edges
    // touch the neighbouring WHITE stripes), the RIGHT patch lies on a WHITE
    // stripe (its long edges touch BLACK). Both patches are literally the SAME
    // mid-grey (rgb 128). Counter-intuitively the patch-on-black looks LIGHTER
    // and the patch-on-white looks DARKER — the OPPOSITE of simple contrast
    // (more white contact "should" darken it). That reversal is White's illusion.
    //
    // Once per loop a connector bar of that SAME grey slides across the grating
    // (drawn ON TOP of the stripes) to bridge the two patches. At full extension
    // patch + bar + patch read as one continuous grey corridor -> undeniable
    // proof the greys are equal. A triangle wave on p makes the bar fully
    // retracted at p=0 and p=1, so draw(0) === draw(1) (seamless loop). The
    // stripes themselves are static (White's illusion is a static effect).

    const BX0 = S.x0, BY0 = S.y0, BX1 = S.x1, BY1 = S.y1;
    const BW = BX1 - BX0, BH = BY1 - BY0;

    const BLACK = 'rgb(10,10,10)';
    const WHITE = 'rgb(245,245,245)';
    const GREY = 'rgb(128,128,128)';   // the identical test grey

    // Grating: 10 vertical stripes across the 940px-wide box -> 94px each, exact.
    const N_STRIPES = 10;
    const stripeW = BW / N_STRIPES;    // 94
    // Stripe i is BLACK when i is even (0,2,4,...), WHITE when odd.
    const isBlackStripe = (i) => (i % 2) === 0;

    ctx.save();

    // Clip everything to the safe box so nothing spills into the title / UI zone.
    ctx.beginPath();
    ctx.rect(BX0, BY0, BW, BH);
    ctx.clip();

    // 1) Draw the vertical black/white grating.
    for (let i = 0; i < N_STRIPES; i++) {
      const sx = BX0 + i * stripeW;
      ctx.fillStyle = isBlackStripe(i) ? BLACK : WHITE;
      // +1px overdraw on the right kills sub-pixel seams between stripes.
      ctx.fillRect(sx, BY0, stripeW + 1, BH);
    }

    // 2) Two grey test patches, each the width of one stripe, same row & height.
    //    LEFT patch sits on a BLACK stripe; RIGHT patch on a WHITE stripe, three
    //    stripes apart so a clear band of grating separates them for the bridge.
    const leftStripe = 4;   // black (even) — flanked by white stripes 3 & 5
    const rightStripe = 7;  // white (odd) — flanked by black stripes 6 & 8; pair centred in box
    const patchH = 380;
    const rowCy = Math.round((BY0 + BY1) / 2);   // 950, vertical centre of the row
    const patchY = rowCy - patchH / 2;

    const leftX = BX0 + leftStripe * stripeW;
    const rightX = BX0 + rightStripe * stripeW;

    // 3) Sliding connector corridor of the SAME grey, drawn UNDER the patches so
    //    bar-grey and patch-grey merge into one seamless fill at full extension.
    //    It grows from the inner (right) edge of the LEFT patch to the inner
    //    (left) edge of the RIGHT patch, then retracts.
    const tri = p < 0.5 ? p * 2 : 2 - p * 2;     // 0 -> 1 -> 0 (one bridge per loop)
    const t = smooth(tri);
    const barH = Math.round(patchH * 0.40);      // corridor height (inside patch height)
    const barY = rowCy - barH / 2;
    const barLeft = leftX + stripeW;             // inner (right) edge of left patch
    const barRightFull = rightX;                 // inner (left) edge of right patch
    const barRight = lerp(barLeft, barRightFull, t);
    if (barRight > barLeft + 0.5) {
      ctx.fillStyle = GREY;
      ctx.fillRect(barLeft, barY, barRight - barLeft, barH);
    }

    // 4) The two test patches, IDENTICAL grey, painted ON TOP of the bar. Each is
    //    exactly one stripe wide so its long vertical edges abut the opposite
    //    colour (left patch flanked by white, right patch flanked by black).
    ctx.fillStyle = GREY;
    ctx.fillRect(leftX, patchY, stripeW, patchH);
    ctx.fillRect(rightX, patchY, stripeW, patchH);

    ctx.restore();
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
