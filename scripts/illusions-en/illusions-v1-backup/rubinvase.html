<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'rubinvase',
    name: 'Rubin vase',
    title: 'A vase — or two faces?',
    dur: 8,            // seconds
    fps: 30,
    light: true,       // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const S = H.safe;

    // ---- Rubin's vase (figure / ground reversal) ----------------------------
    // The classic ambiguous figure: a single CENTRAL silhouette that reads either
    // as a VASE/goblet (if it is the figure) OR as TWO FACES looking inward (if
    // the surrounding area is the figure and the silhouette is the gap between
    // two profiles). The vase's left and right contours ARE the two facial
    // profiles: from the top down each side traces forehead -> brow -> nose ->
    // upper lip -> mouth -> lower lip -> chin -> neck. Crisp 2-tone, high contrast.
    //
    // Animation: we slowly CROSS-FADE the two tones (vase colour <-> ground
    // colour) over the loop. At one extreme it is a dark vase on a light page;
    // at the other it is a light vase on a dark page (= the dark faces stand out).
    // That luminance swap keeps toggling which region the eye grabs as "figure".
    // The mix follows (1-cos(p*TAU))/2: it is 0 at p=0 AND p=1 (seamless loop),
    // swelling to 1 at p=0.5 and easing back -- one full, smooth there-and-back
    // colour swap per clip with no jump at the wrap.

    const cx = (S.x0 + S.x1) / 2;            // 540
    const cy = (S.y0 + S.y1) / 2;            // 950
    const boxW = S.x1 - S.x0;                // 940
    const boxH = S.y1 - S.y0;                // 1140

    // Two pure tones; we lerp between them by `mix`.
    const LIGHT = 245, DARK = 22;
    const mix = (1 - Math.cos(p * TAU)) / 2; // 0 -> 1 -> 0 across the loop, seamless
    const groundV = Math.round(lerp(LIGHT, DARK, mix)); // page tone
    const vaseV   = Math.round(lerp(DARK, LIGHT, mix)); // silhouette tone (opposite)
    const GROUND = `rgb(${groundV},${groundV},${groundV})`;
    const VASE   = `rgb(${vaseV},${vaseV},${vaseV})`;

    ctx.save();

    // 1) Ground: fill the whole safe panel (canvas underneath is black).
    ctx.fillStyle = GROUND;
    ctx.fillRect(S.x0, S.y0, boxW, boxH);

    // 2) The vase silhouette, centred. Built as a closed path that is mirror-
    //    symmetric about the vertical centre line cx. The RIGHT contour is a face
    //    profile that looks LEFT (toward centre); mirroring it gives the LEFT
    //    contour as a face looking RIGHT. The gap between the two faces is the vase.
    //
    //    The profile is described as horizontal HALF-WIDTHS (distance from the
    //    centre line) at a series of vertical stations from top to bottom. A small
    //    half-width = the two faces nearly touch (the vase "waist"/neck); a large
    //    half-width = the faces are far apart (the bulb / lips region). Reading the
    //    half-width curve top->bottom as a silhouette edge yields a recognisable
    //    profile: a flat-ish forehead, a notch at the brow, a protruding nose, a
    //    dip for the upper lip, full lips, a chin, then the neck.
    //
    //    Vase height ~ full safe height with margins; vertical span clamped inside.
    const topY = cy - 470;                   // 480, > S.y0 (380) margin
    const botY = cy + 470;                    // 1420, < S.y1 (1520) margin
    const vh = botY - topY;                   // 940

    // Profile stations: t in [0,1] down the silhouette, hw = half-width in px.
    // Read top->bottom the RIGHT edge must look like a human face in profile that
    // faces LEFT (toward the centre line). To read as a face the features must be
    // DISTINCT and smooth, not a stack of equal bumps:
    //   - a rounded forehead that slopes back,
    //   - ONE clean protruding NOSE (a single forward triangle),
    //   - a set-back upper lip, a gap, a slightly-forward lower lip,
    //   - a strong forward CHIN,
    //   - then the jaw tucks back to a slim neck.
    // Small hw = faces nearly touch (vase neck/waist); large hw = faces far apart
    // (vase bulb). The vase ends in a flared foot at the bottom.
    //   t      feature                       hw (px from centre)
    // -----------------------------------------------------------
    const STN = [
      [0.000, 124],  // top rim of the goblet / crown — flat-ish cap
      [0.040, 152],  // rim flares slightly (lip of the vase)
      [0.090, 116],  // under the rim, curving in to the head
      [0.170,  88],  // forehead — set back, rounded (the head's most recessed point up top)
      [0.250,  84],  // brow, sloping down toward the bridge of the nose
      [0.300, 104],  // nose bridge pushing forward
      [0.355, 152],  // NOSE TIP — single clean apex jutting toward centre (peak)
      [0.395, 116],  // underside of the nose comes back
      [0.430,  84],  // philtrum — set back under the nose (one clean notch, not two)
      [0.470, 120],  // LIPS — one gentle forward curve (mouth region)
      [0.520,  96],  // mouth line / lower lip settling back a touch
      [0.575,  78],  // recess under the lip — sets up the chin
      [0.645, 138],  // CHIN — full and forward, the strong lower face point
      [0.715,  92],  // jaw sweeps back smoothly
      [0.775,  60],  // under the jaw -> throat: the slim WAIST of the vase
      [0.835,  74],  // base of the neck starts to widen
      [0.890, 128],  // stem widens toward the foot
      [0.940, 184],  // vase foot flares out
      [0.978, 206],  // foot rim (widest at the base)
      [1.000, 150],  // bottom edge of the pedestal
    ];

    // Smooth interpolation of half-width at any t via monotone-ish Catmull-Rom on
    // the station list. Returns half-width in px.
    const halfWidthAt = (t) => {
      t = clamp(t, 0, 1);
      // find bracketing stations
      let i = 0;
      while (i < STN.length - 1 && STN[i + 1][0] < t) i++;
      const i0 = Math.max(0, i - 1), i1 = i, i2 = Math.min(STN.length - 1, i + 1), i3 = Math.min(STN.length - 1, i + 2);
      const A = STN[i1], B = STN[i2];
      const span = (B[0] - A[0]) || 1e-6;
      const lt = clamp((t - A[0]) / span, 0, 1);
      const p0 = STN[i0][1], p1 = A[1], p2 = B[1], p3 = STN[i3][1];
      const t2 = lt * lt, t3 = t2 * lt;
      // Catmull-Rom (tension 0.5)
      return 0.5 * ((2 * p1) + (-p0 + p2) * lt + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
    };

    // Build the closed silhouette: down the RIGHT edge, then up the LEFT edge.
    const STEPS = 220;
    ctx.beginPath();
    // right edge, top -> bottom
    for (let k = 0; k <= STEPS; k++) {
      const t = k / STEPS;
      const y = topY + t * vh;
      const x = cx + halfWidthAt(t);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    // left edge, bottom -> top (mirror)
    for (let k = STEPS; k >= 0; k--) {
      const t = k / STEPS;
      const y = topY + t * vh;
      const x = cx - halfWidthAt(t);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = VASE;
    ctx.fill();

    ctx.restore();
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
