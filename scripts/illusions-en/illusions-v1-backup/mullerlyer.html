<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'mullerlyer',
    name: 'Müller-Lyer illusion',
    title: 'These two lines are the same length',
    dur: 8,            // seconds
    fps: 30,
    light: false,      // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const S = H.safe;
    // ---- Müller-Lyer ------------------------------------------------------
    // Two horizontal SHAFTS of EXACTLY identical length, stacked.
    //   TOP    shaft: OUTWARD-pointing fins   >----<  (looks SHORTER)
    //   BOTTOM shaft: INWARD-pointing fins    <---->  (looks LONGER)
    // Once per loop we reveal thin vertical end-markers at all four shaft ends
    // plus a faint equal-length GHOST bar proving the two shafts match, then
    // hide it again so draw(0)===draw(1). White on black.

    const cx = Math.round((S.x0 + S.x1) / 2);        // 540, shared horizontal centre
    // two stacked shafts comfortably inside the safe band
    const yTop = 740;                                 // outward fins (>----<)
    const yBot = 1180;                                // inward  fins (<---->)

    // --- THE invariant: identical shaft length -----------------------------
    const HALF = 330;                                 // half-length of EACH shaft
    // ends are at cx-HALF .. cx+HALF = 210 .. 870 (well inside x0..x1)
    const xL = cx - HALF, xR = cx + HALF;

    // --- fin geometry -------------------------------------------------------
    const FIN = 96;            // fin length
    const FIN_ANG = Math.PI * 0.30; // angle of fins off the shaft axis (~54deg)
    const dx = Math.round(Math.cos(FIN_ANG) * FIN);
    const dy = Math.round(Math.sin(FIN_ANG) * FIN);
    // Vertical extents of fins from the shaft: ±dy. Top shaft fins reach
    // yTop-dy..yTop+dy; bottom yBot-dy..yBot+dy. With dy~56 both stay in band.

    const WHITE = 'rgb(245,245,245)';
    const LW = 9;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // helper: draw one shaft + its two arrow fins.
    //   dir = +1  -> fins point OUTWARD (away from shaft)  >----<
    //   dir = -1  -> fins point INWARD  (toward shaft)     <---->
    const drawShaft = (y, dir) => {
      ctx.strokeStyle = WHITE;
      ctx.lineWidth = LW;
      // the shaft itself
      ctx.beginPath();
      ctx.moveTo(xL, y);
      ctx.lineTo(xR, y);
      ctx.stroke();
      // left-end fins: tip sits at (xL - dir*dx) so dir=+1 -> tip to the LEFT
      // (outward V opening left), dir=-1 -> tip to the RIGHT (inward).
      const lTipX = xL - dir * dx;
      ctx.beginPath();
      ctx.moveTo(lTipX, y - dy);
      ctx.lineTo(xL, y);
      ctx.lineTo(lTipX, y + dy);
      ctx.stroke();
      // right-end fins: mirror of the left.
      const rTipX = xR + dir * dx;
      ctx.beginPath();
      ctx.moveTo(rTipX, y - dy);
      ctx.lineTo(xR, y);
      ctx.lineTo(rTipX, y + dy);
      ctx.stroke();
    };

    drawShaft(yTop, +1); // outward >----<  (appears shorter)
    drawShaft(yBot, -1); // inward  <---->  (appears longer)

    // --- once-per-loop PROOF reveal ----------------------------------------
    // Thin vertical end-markers at the four shaft ends + a faint equal-length
    // ghost bar centred between the two shafts, fading in then out so it is
    // invisible at p=0 and p=1 (seamless). bump: 0 -> 1 -> 0 around p=0.5.
    let reveal = 0;
    if (p > 0.30 && p < 0.70) {
      const t = (p - 0.30) / 0.40;          // 0..1 across the window
      reveal = Math.sin(t * Math.PI);       // 0 -> 1 -> 0 (smooth bump)
    }
    if (reveal > 0.001) {
      ctx.save();
      ctx.lineCap = 'butt';
      // vertical end-markers: short ticks straddling each shaft end, plus thin
      // dashed droplines connecting the two shafts' ends so the eye sees the
      // x-positions line up exactly between top and bottom.
      const tickH = 30;
      ctx.strokeStyle = `rgba(120,220,255,${0.95 * reveal})`;
      ctx.lineWidth = 4;
      for (const x of [xL, xR]) {
        for (const y of [yTop, yBot]) {
          ctx.beginPath();
          ctx.moveTo(x, y - tickH);
          ctx.lineTo(x, y + tickH);
          ctx.stroke();
        }
      }
      // dashed vertical droplines from top shaft end to bottom shaft end
      ctx.setLineDash([10, 9]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = `rgba(120,220,255,${0.55 * reveal})`;
      for (const x of [xL, xR]) {
        ctx.beginPath();
        ctx.moveTo(x, yTop + tickH);
        ctx.lineTo(x, yBot - tickH);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      // faint equal-length GHOST bar exactly between the two shafts: same xL..xR
      const yMid = Math.round((yTop + yBot) / 2);
      ctx.strokeStyle = `rgba(120,220,255,${0.9 * reveal})`;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(xL, yMid);
      ctx.lineTo(xR, yMid);
      ctx.stroke();
      // end caps on the ghost bar so its length reads unambiguously
      ctx.lineWidth = 4;
      ctx.lineCap = 'butt';
      for (const x of [xL, xR]) {
        ctx.beginPath();
        ctx.moveTo(x, yMid - tickH);
        ctx.lineTo(x, yMid + tickH);
        ctx.stroke();
      }
      // small "=" length label near the ghost bar's centre
      ctx.fillStyle = `rgba(120,220,255,${0.95 * reveal})`;
      ctx.font = '700 40px "DejaVu Sans","Liberation Sans",Arial,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('equal', cx, yMid - 56);
      ctx.restore();
    }

    void H.rng; // deterministic geometry; no randomness needed
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
