<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'coffer',
    name: 'Coffer illusion',
    title: 'Can you find the 16 circles?',
    dur: 9,            // seconds
    fps: 30,
    light: true,       // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    // --- COFFER ILLUSION (Anthony Norcia, 2006) -------------------------------
    //   A grid of grooved rectangular "coffers" (recessed panels) drawn with a 3D
    //   bevel: every contour is a LIGHT line (lit from the top-left) paired with a
    //   DARK line (its shadow). The brain locks onto the rectangles first. But each
    //   coffer's corners are CONCAVE arcs centred on the lattice NODE it shares with
    //   three neighbours, so the four concave cuts meeting at every interior node
    //   fuse into a full CIRCLE. The SAME beveled segments belong to a rectangle
    //   edge AND a circle => bistable: rectangles, then 16 hidden circles emerge.
    //   A 5x5 tile grid has 4x4 = 16 interior nodes -> exactly 16 circles.
    const S = H.safe;
    const W = S.x1 - S.x0, Hh = S.y1 - S.y0;

    // Mid-grey field — the neutral luminance the light/dark bevel grooves sit on.
    const BG = 'rgb(150,150,150)';
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, CW, CH);

    // Clip strictly to the safe box so nothing bleeds into the title / bottom UI.
    ctx.save();
    ctx.beginPath();
    ctx.rect(S.x0, S.y0, W, Hh);
    ctx.clip();
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'miter';

    // --- lattice geometry ------------------------------------------------------
    const tilesX = 5, tilesY = 5;                 // 4x4 = 16 interior nodes -> 16 circles
    const pitch = Math.floor(W / tilesX);         // square pitch => circles are round (188)
    const ox = S.x0 + Math.round((W - tilesX * pitch) / 2);
    const gridH = tilesY * pitch;
    const oy = Math.round(S.y0 + (Hh - gridH) / 2); // centre the block vertically
    const r = Math.round(0.35 * pitch);           // concave-corner radius = circle radius
    const lw = 9;                                  // core line width
    const bev = 6;                                 // bevel half-offset -> groove width

    // --- gentle seamless shimmer ----------------------------------------------
    // Static illusion: we must NOT move the precise line work. Instead breathe the
    // bevel CONTRAST over whole cosine periods so draw(0) === draw(1). The faint
    // pulse makes the grooves shimmer and helps the hidden circles wink in/out.
    const shimmer = 0.5 - 0.5 * Math.cos(p * TAU);      // 0..1..0, one full period
    const amp = 18;                                      // brightness swing of the bevel
    const lo = Math.round(238 - amp + amp * shimmer);    // light line 220..238
    const hi = Math.round(66 + amp - amp * shimmer);     // dark  line 66..84 (contrast tracks)
    const LIGHT = `rgb(${lo},${lo},${lo})`;
    const DARK = `rgb(${hi},${hi},${hi})`;

    // Draw a path twice with a sub-pixel offset for the embossed 3D groove: a light
    // copy shifted up-left (the lit ridge) and a dark copy shifted down-right (shadow).
    function beveled(buildPath) {
      ctx.save(); ctx.translate(-bev, -bev);
      ctx.strokeStyle = LIGHT; ctx.lineWidth = lw; ctx.beginPath(); buildPath(); ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.translate(bev, bev);
      ctx.strokeStyle = DARK; ctx.lineWidth = lw; ctx.beginPath(); buildPath(); ctx.stroke();
      ctx.restore();
    }

    // One coffer tile: a square with CONCAVE corners. Each corner sits on a lattice
    // node and is cut by a quarter-arc centred at that node (radius r) bulging INTO
    // the tile. Straight edges run between the arc endpoints (the rectangle reading);
    // the four arcs around any interior node lie on one circle (the circle reading).
    function tilePath(tx, ty) {
      const x0 = ox + tx * pitch, y0 = oy + ty * pitch, x1 = x0 + pitch, y1 = y0 + pitch;
      ctx.moveTo(x0 + r, y0);
      ctx.lineTo(x1 - r, y0);
      ctx.arc(x1, y0, r, Math.PI, Math.PI * 0.5, true);   // top-right concave cut
      ctx.lineTo(x1, y1 - r);
      ctx.arc(x1, y1, r, -Math.PI * 0.5, -Math.PI, true); // bottom-right
      ctx.lineTo(x0 + r, y1);
      ctx.arc(x0, y1, r, 0, -Math.PI * 0.5, true);        // bottom-left
      ctx.lineTo(x0, y0 + r);
      ctx.arc(x0, y0, r, Math.PI * 0.5, 0, true);         // top-left
      ctx.closePath();
    }

    for (let ty = 0; ty < tilesY; ty++)
      for (let tx = 0; tx < tilesX; tx++)
        beveled(() => tilePath(tx, ty));

    ctx.restore();
    void H.rng; // deterministic lattice; no randomness needed
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
