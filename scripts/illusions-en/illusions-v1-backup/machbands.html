<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>illusions-en host</title>
<style>html,body{margin:0;padding:0;background:#000}#scene{display:block}</style>
</head>
<body>
<canvas id="scene" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';
  // ============================================================================
  //  SHARED HOST  —  DO NOT EDIT below except the two clearly marked regions:
  //    (1) the SPEC block        (2) the drawIllusion() function
  //  Everything else (RNG, title, vignette, loop, PNG export) is identical for
  //  every illusion so titles / safe-zone / seamless-loop behave the same.
  // ============================================================================
  const CW = 1080, CH = 1920, TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // deterministic RNG (so a clip renders byte-identically every time)
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      let t = s += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, lo, hi) => x < lo ? lo : x > hi ? hi : x;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  // Safe drawing box: title lives above y=380, bottom 400px kept clear (Shorts UI).
  const SAFE = { x0: 70, y0: 380, x1: 1010, y1: 1520 };
  const H = { TAU, rng: mulberry32, lerp, clamp, smooth, cx: 540, cy: 960, safe: SAFE,
              maxR: 460 /* suggested max radius for a centred figure */ };

  // ====================== (1) SPEC — replace these values =====================
  let SPEC = {
    key: 'machbands',
    name: 'Mach bands',
    title: 'Each band is a flat, even grey',
    dur: 8,            // seconds
    fps: 30,
    light: true,       // true => skip the dark vignette (for grey/white-background illusions)
  };
  // ===========================================================================

  // ============ (2) drawIllusion — replace this whole function body ==========
  // Contract:
  //   p       progress 0..1 over the clip (build renders frame f at p=f/FRAMES,
  //           so p=0 and p=1 are the SAME instant -> a LOOPING illusion must make
  //           draw(0) == draw(1). Non-looping sequences (e.g. afterimage) ignore this.)
  //   CW,CH   1080 x 1920
  //   H       helpers: H.rng(seed)->()=>0..1, H.lerp, H.clamp, H.smooth, H.TAU,
  //           H.cx, H.cy (frame centre of the safe area), H.safe {x0,y0,x1,y1}, H.maxR
  //   The host fills #000, then calls this, then draws vignette (unless light) + title.
  //   Keep important content inside H.safe. Use H.rng only (no Math.random) for determinism.
  function drawIllusion(ctx, p, CW, CH, H) {
    const S = H.safe;

    // ---- Mach bands ----------------------------------------------------------
    // A horizontal staircase of N uniform grey BANDS stepping dark -> light.
    // Every band is filled with ONE flat grey value (no gradient inside it), yet
    // at each hard step edge the eye sees an illusory BRIGHT scallop on the
    // lighter side and a DARK scallop on the darker side (lateral inhibition).
    //
    // Proof / reveal (gentle, once per loop): thin black separator gaps slide in
    // at every step edge. Decoupling the neighbouring bands removes the edge
    // contrast, so the illusory bright/dark Mach bands vanish and each band
    // reads as the flat, even grey it truly is. A persistent FLAT REFERENCE
    // strip below the staircase is one single uniform grey -> an anchor the eye
    // can trust. Triangle wave on p makes draw(0)===draw(1) (seamless loop:
    // separators fully retracted at both ends).

    const BX0 = S.x0, BY0 = S.y0, BX1 = S.x1, BY1 = S.y1;
    const BW = BX1 - BX0, BH = BY1 - BY0;

    // Layout: tall staircase on top, a thin label gap, then a flat reference bar.
    const refH = Math.round(BH * 0.16);          // height of the flat reference strip
    const gapH = Math.round(BH * 0.07);          // gap between staircase and reference
    const stairY0 = BY0;
    const stairY1 = BY1 - refH - gapH;
    const stairH = stairY1 - stairY0;
    const refY0 = BY1 - refH;
    const refY1 = BY1;

    const N = 10;                                 // number of grey steps
    const bandW = BW / N;                         // each band's width

    // Grey staircase values: evenly spaced, comfortably inside [dark, light].
    // More bands with SMALLER increments per step is what makes the classic
    // STAIRCASE Mach bands pop: each flat band then looks concave -> a dark
    // scallop hugging its darker edge and a bright scallop hugging its lighter
    // edge, even though the fill is perfectly uniform.
    const G_LO = 36, G_HI = 226;                  // darkest / lightest band (0..255)
    const grey = (i) => Math.round(lerp(G_LO, G_HI, i / (N - 1)));
    const greyCss = (i) => { const v = grey(i); return `rgb(${v},${v},${v})`; };

    ctx.save();

    // Clip everything to the safe box so nothing spills into the title / UI zone.
    ctx.beginPath();
    ctx.rect(BX0, BY0, BW, BH);
    ctx.clip();

    // 1) The staircase: N vertical bands, each a single flat grey. Painted with a
    //    1px overlap so there are no sub-pixel seams BETWEEN bands (a stray dark
    //    line would itself look like a Mach band and confuse the demo).
    for (let i = 0; i < N; i++) {
      const x = BX0 + i * bandW;
      ctx.fillStyle = greyCss(i);
      ctx.fillRect(Math.floor(x), stairY0, Math.ceil(bandW) + 1, stairH);
    }

    // 2) The reveal: thin BLACK separator gaps at each internal step edge.
    //    They grow from the centre row outward to cover the full staircase
    //    height, breaking the edge coupling so the Mach bands disappear.
    const tri = p < 0.5 ? p * 2 : 2 - p * 2;      // 0 -> 1 -> 0 (one reveal per loop)
    const t = smooth(tri);
    const sepW = 10;                              // separator thickness (px)
    const rowCy = (stairY0 + stairY1) / 2;
    const halfCover = (stairH / 2) * t;           // how far the gap has opened
    if (t > 0.001) {
      ctx.fillStyle = 'rgb(0,0,0)';
      const gy0 = rowCy - halfCover, gy1 = rowCy + halfCover;
      for (let i = 1; i < N; i++) {
        const ex = BX0 + i * bandW;               // the i-th internal edge
        ctx.fillRect(Math.round(ex - sepW / 2), gy0, sepW, gy1 - gy0);
      }
    }

    // 3) Flat REFERENCE strip: the SAME staircase greys, but with permanent black
    //    separators between every band from the start. Because the edges are
    //    always decoupled here, NO Mach bands appear -> this strip shows the true,
    //    flat tone of every step. Direct visual proof to compare against the top.
    const refSep = 10;
    for (let i = 0; i < N; i++) {
      const x = BX0 + i * bandW;
      // black under-fill makes the inter-band gaps read as clean separators
      ctx.fillStyle = 'rgb(0,0,0)';
      ctx.fillRect(Math.floor(x), refY0, Math.ceil(bandW) + 1, refY1 - refY0);
      // the flat grey swatch, inset by the separator so each is fully isolated
      ctx.fillStyle = greyCss(i);
      const ix = (i === 0) ? Math.floor(x) : Math.floor(x) + Math.round(refSep / 2);
      const iw = Math.ceil(bandW) - ((i === 0 || i === N - 1) ? Math.round(refSep / 2) : refSep);
      ctx.fillRect(ix, refY0, Math.max(1, iw), refY1 - refY0);
    }

    ctx.restore();
  }
  // ===========================================================================

  // ---------------- title (baked into the canvas, with a dark pill) ----------
  let TITLE_LINES = [], TITLE_PX = 60;
  const TITLE_FONT = (px) => `800 ${px}px "DejaVu Sans","Liberation Sans",Arial,sans-serif`;
  const TITLE_MAXW = 920;
  function layoutTitle(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) { TITLE_LINES = []; return; }
    for (let px = 72; px >= 40; px -= 2) {
      ctx.font = TITLE_FONT(px);
      const lines = []; let cur = '';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= TITLE_MAXW || !cur) cur = test;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      const tooWide = lines.some((l) => ctx.measureText(l).width > TITLE_MAXW);
      if (lines.length <= 3 && !tooWide) { TITLE_LINES = lines; TITLE_PX = px; return; }
      if (px === 40) { TITLE_LINES = lines.slice(0, 3); TITLE_PX = px; }
    }
  }
  function drawTitle() {
    if (!TITLE_LINES.length) return;
    ctx.save();
    ctx.font = TITLE_FONT(TITLE_PX);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lh = TITLE_PX * 1.2, n = TITLE_LINES.length;
    const startY = 210, padX = 42, padY = 28;
    let maxW = 0; for (const l of TITLE_LINES) maxW = Math.max(maxW, ctx.measureText(l).width);
    const rx = CW / 2 - maxW / 2 - padX, rw = maxW + padX * 2;
    const ry = startY - lh / 2 - padY, rh = (n - 1) * lh + lh + padY * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 28); ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    let y = startY; for (const l of TITLE_LINES) { ctx.fillText(l, CW / 2, y); y += lh; }
    ctx.restore();
  }
  function drawVignette() {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.52, CW * 0.2, CW / 2, CH * 0.52, CH * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.64, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.66)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }

  window.setup = function (overrides) {
    if (overrides && typeof overrides === 'object') SPEC = { ...SPEC, ...overrides };
    layoutTitle(SPEC.title);
    return { key: SPEC.key, name: SPEC.name, dur: SPEC.dur, fps: SPEC.fps, lines: TITLE_LINES.length, px: TITLE_PX };
  };
  window.getSpec = function () { return { ...SPEC }; };

  window.renderFrame = function (progress) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    drawIllusion(ctx, progress, CW, CH, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (!SPEC.light) drawVignette();
    drawTitle();
    return canvas.toDataURL('image/png');
  };

  layoutTitle(SPEC.title);
  window.__ready = true;
})();
</script>
</body>
</html>
