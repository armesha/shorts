<!doctype html>
<!-- Christian (English KJV) verse card. Mirrors the proven anecdote/islamic structure: one sized
     box, bg on it, no absolute layers / transforms (those blank text paint in headless Chrome 149).
     LTR English; classic serif (system Liberation/DejaVu Serif). Cream text + gold reference on the
     dark gold-framed protestant backgrounds, auto-fit to fill each background's safe zone. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:{{BG}};
    --safe-top:{{SAFE_TOP}}px; --safe-right:{{SAFE_RIGHT}}px; --safe-bottom:{{SAFE_BOTTOM}}px; --safe-left:{{SAFE_LEFT}}px;
    --verse:72px; --ref:38px; --line:1.5; --gap:38px;
    --cream:#f7ecd2; --gold:#e6c789;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}
  .card{position:relative;width:1080px;height:1920px;background:var(--bg);
    padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    font-family:"Liberation Serif","DejaVu Serif","Noto Serif",Georgia,"Times New Roman",serif;}
  /* legibility scrim behind the text zone — pseudo-element = same paint layer (no transform). */
  .card::before{content:"";position:absolute;
    top:calc(var(--safe-top) - 110px);left:calc(var(--safe-left) - 110px);
    right:calc(var(--safe-right) - 110px);bottom:calc(var(--safe-bottom) - 110px);
    background:radial-gradient(ellipse at center, rgba(0,0,0,.66) 0%, rgba(0,0,0,.40) 54%, rgba(0,0,0,0) 80%);}
  .frame{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .col{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap);text-align:center;
    padding:32px 40px 38px;border-radius:42px;
    background:linear-gradient(180deg,rgba(6,5,4,.60),rgba(6,5,4,.38));
    border:1px solid rgba(230,199,137,.18);
    box-shadow:0 18px 56px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.06);}
  .verse{width:100%;text-align:center;font-weight:400;
    font-size:var(--verse);line-height:var(--line);color:var(--cream);
    text-shadow:0 2px 16px rgba(0,0,0,.74), 0 0 3px rgba(0,0,0,.6);
    word-wrap:break-word;overflow-wrap:break-word;text-wrap:balance;}
  .ref{font-weight:700;color:var(--gold);font-size:var(--ref);letter-spacing:.4px;text-transform:none;
    text-shadow:0 2px 10px rgba(0,0,0,.85);
    border-top:1px solid rgba(230,199,137,.45);padding-top:20px;margin-top:4px;max-width:92%;}
</style>
</head>
<body>
  <div class="card">
    <div class="frame" id="frame">
      <div class="col" id="col">
        <div class="verse" id="verse">{{TEXT}}</div>
        <div class="ref" id="ref">{{REF}}</div>
      </div>
    </div>
  </div>
<script>
  var root=document.documentElement,
      frame=document.getElementById('frame'),
      col=document.getElementById('col'),
      verse=document.getElementById('verse');
  function fits(){
    return col.scrollHeight <= frame.clientHeight + 1
        && verse.scrollWidth <= verse.clientWidth + 1;
  }
  function setV(s){
    root.style.setProperty('--verse', s+'px');
    root.style.setProperty('--ref', Math.max(26, Math.min(46, Math.round(s*0.46)))+'px');
  }
  function fit(){
    var s=34; setV(s); var g=0;
    while(s<150 && g++<700){ setV(s+2); if(fits()) s+=2; else { setV(s); break; } }
    g=0; while(!fits() && s>18 && g++<700){ s-=2; setV(s); }
    window.__fitFontPx=s; window.__fitted=true;
  }
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);} else fit();
  setTimeout(function(){ if(!window.__fitted) fit(); }, 1800);
</script>
</body>
</html>
