<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;750;850&family=PT+Serif:wght@600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  .card {
    position: relative;
    width: 1080px; height: 1920px;
    background: linear-gradient(180deg, var(--scrim-a), var(--scrim-b)), var(--bg, #f7f2e8);
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 42px 42px 360px 42px;
    border: 3px solid color-mix(in srgb, var(--accent) 58%, white);
    border-radius: 46px;
    opacity: 0.72;
    pointer-events: none;
  }
  .card::after {
    content: attr(data-template);
    position: absolute;
    right: 60px;
    bottom: 80px;
    width: 310px;
    height: 310px;
    border-radius: 46px;
    background:
      radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--accent-2) 42%, transparent) 0 16%, transparent 17%),
      radial-gradient(circle at 70% 64%, color-mix(in srgb, var(--accent) 36%, transparent) 0 13%, transparent 14%),
      linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.02));
    border: 2px dashed rgba(255, 255, 255, 0.45);
    color: transparent;
    opacity: 0.4;
    pointer-events: none;
  }
  .title {
    position: absolute;
    left: var(--title-left); top: var(--title-top);
    width: var(--title-width); height: var(--title-height);
    display: flex; align-items: center; justify-content: center;
    padding: 20px 34px;
    border-radius: var(--title-radius);
    background:
      linear-gradient(135deg, color-mix(in srgb, var(--title-bg) 88%, white), var(--title-bg)),
      var(--title-bg);
    color: var(--title-fg);
    font-family: Inter, Arial, sans-serif;
    font-weight: 850;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0;
    line-height: 1.04;
    font-size: var(--title-size);
    text-wrap: balance;
    overflow: hidden;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
  }
  .title::before {
    content: "";
    position: absolute;
    left: 22px; right: 22px; top: 18px;
    height: 8px;
    border-radius: 999px;
    background: var(--accent-2);
    opacity: 0.85;
  }
  .body {
    position: absolute;
    left: var(--body-left); top: var(--body-top);
    width: var(--body-width); height: var(--body-height);
    padding: 50px 56px;
    border-radius: var(--body-radius);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0)),
      var(--body-bg);
    border: 3px solid var(--panel-border);
    box-shadow: var(--panel-shadow);
    overflow: hidden;
    color: var(--ink);
  }
  .body::before {
    content: "";
    position: absolute;
    left: 36px; right: 36px; top: 34px;
    height: 10px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity: 0.9;
  }
  .body::after {
    content: "";
    position: absolute;
    inset: 76px 42px 38px 42px;
    background: repeating-linear-gradient(180deg, transparent 0 62px, var(--rule) 63px 65px);
    pointer-events: none;
  }
  .text {
    position: relative;
    z-index: 1;
    font-family: 'PT Serif', Georgia, 'DejaVu Serif', serif;
    font-weight: 700;
    font-size: var(--text-size);
    line-height: var(--text-lh);
    color: var(--ink);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    hyphens: auto;
  }
  .layout-ledger .body { transform: rotate(-0.6deg); }
  .layout-ledger .title { transform: rotate(0.6deg); }
  .layout-note .body { border-radius: 30px 60px 36px 44px; }
  .layout-note .title { border-radius: 999px; }
  .layout-poster .body {
    top: calc(var(--body-top) + 26px);
    height: calc(var(--body-height) - 40px);
    border-width: 0;
  }
  .layout-poster .title { left: calc(var(--title-left) + 34px); width: calc(var(--title-width) - 60px); }
  .layout-split .title {
    width: 330px;
    height: 310px;
    align-items: center;
    padding: 30px;
    font-size: 54px;
  }
  .layout-split .body {
    top: 420px;
    height: 910px;
    padding-top: 58px;
  }
  .layout-label .title {
    height: 135px;
    justify-content: flex-start;
    text-align: left;
  }
  .layout-label .body {
    top: 450px;
    height: 895px;
  }
</style>
</head>
<body>
  <div class="card {{TEMPLATE_CLASS}}" data-template="{{TEMPLATE_ID}}" style="--bg: {{BG}}; {{STYLE}}">
    <div class="title">{{TITLE}}</div>
    <div class="body">
      <div class="text">{{TEXT}}</div>
    </div>
  </div>

  <script>
    (function () {
      function fit() {
        var body = document.querySelector('.body');
        var text = document.querySelector('.text');
        var title = document.querySelector('.title');

        var tmin = 26, tmax = 76, tbest = tmin;
        while (tmin <= tmax) {
          var tm = (tmin + tmax) >> 1;
          title.style.fontSize = tm + 'px';
          if (title.scrollWidth <= title.clientWidth && title.scrollHeight <= title.clientHeight) {
            tbest = tm; tmin = tm + 1;
          } else { tmax = tm - 1; }
        }
        title.style.fontSize = tbest + 'px';

        var bodyStyle = getComputedStyle(body);
        var padY = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
        var availableH = Math.max(1, body.clientHeight - padY - 8);

        text.style.lineHeight = getComputedStyle(text).getPropertyValue('--text-lh') || '1.28';
        var min = 20, max = 58, best = min;
        while (min <= max) {
          var mid = (min + max) >> 1;
          text.style.fontSize = mid + 'px';
          var fitsV = text.scrollHeight <= availableH;
          var fitsH = text.scrollWidth <= text.clientWidth + 2;
          if (fitsV && fitsH) { best = mid; min = mid + 1; }
          else { max = mid - 1; }
        }
        text.style.fontSize = best + 'px';

        window.__fitFontPx = best;
        window.__fitted = true;
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      else fit();
      setTimeout(function () { if (!window.__fitted) fit(); }, 1500);
    })();
  </script>
</body>
</html>
