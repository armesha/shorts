<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;750;850&family=PT+Serif:wght@600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  .card {
    position: relative;
    width: 1080px; height: 1920px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 62%, rgba(255, 255, 255, 0.1)),
      var(--bg, #f7f2e8);
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 50px;
    top: 58px;
    width: 980px;
    height: 1262px;
    border-radius: 44px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.88), rgba(255,255,255,0.78)),
      linear-gradient(135deg, color-mix(in srgb, var(--accent) 9%, transparent), color-mix(in srgb, var(--accent-2) 8%, transparent));
    border: 2px solid rgba(255, 255, 255, 0.75);
    box-shadow: 0 26px 90px rgba(21, 28, 34, 0.16);
    opacity: 1;
    pointer-events: none;
  }
  .card::after {
    content: "";
    position: absolute;
    left: 70px;
    right: 70px;
    top: 1304px;
    height: 2px;
    border-radius: 999px;
    background:
      linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 28%, transparent), transparent);
    border: 0;
    opacity: 0.62;
    pointer-events: none;
  }
  .title {
    position: absolute;
    left: 92px; top: 96px;
    width: 896px; height: 176px;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
    padding: 24px 44px;
    border-radius: 30px;
    background:
      linear-gradient(135deg, color-mix(in srgb, var(--title-bg) 78%, white), var(--title-bg)),
      var(--title-bg);
    color: var(--title-fg);
    font-family: Inter, Arial, sans-serif;
    font-weight: 850;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0;
    line-height: 1.04;
    font-size: var(--title-size);
    text-wrap: balance;
    overflow: hidden;
    box-shadow: 0 16px 44px rgba(14, 18, 22, 0.18);
  }
  .title::before {
    content: "";
    position: absolute;
    left: 34px; right: 34px; bottom: 20px;
    height: 8px;
    border-radius: 999px;
    background: var(--accent-2);
    opacity: 0.82;
  }
  .body {
    position: absolute;
    left: 92px; top: 318px;
    width: 896px; height: 930px;
    z-index: 2;
    padding: 64px 66px 58px 66px;
    border-radius: 34px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.48), rgba(255,255,255,0.12)),
      color-mix(in srgb, var(--body-bg) 88%, white);
    border: 2px solid color-mix(in srgb, var(--panel-border) 62%, white);
    box-shadow: 0 22px 64px rgba(21, 28, 34, 0.15);
    overflow: hidden;
    color: var(--ink);
  }
  .body::before {
    content: "";
    position: absolute;
    left: 66px; right: 66px; top: 34px;
    height: 10px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity: 0.9;
  }
  .body::after {
    content: "";
    position: absolute;
    right: 34px;
    bottom: 30px;
    width: 110px;
    height: 110px;
    border-radius: 32px;
    background:
      linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), transparent),
      radial-gradient(circle at 65% 70%, color-mix(in srgb, var(--accent-2) 20%, transparent) 0 38%, transparent 39%);
    opacity: 0.22;
    pointer-events: none;
  }
  .text {
    position: relative;
    z-index: 1;
    font-family: Inter, Arial, 'DejaVu Sans', sans-serif;
    font-weight: 700;
    font-size: var(--text-size);
    line-height: var(--text-lh);
    color: var(--ink);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    hyphens: auto;
  }
  .layout-ledger .title { border-radius: 28px 28px 56px 28px; }
  .layout-note .title { border-radius: 999px; }
  .layout-poster .title { border-radius: 22px; }
  .layout-poster .body { border-radius: 22px 48px 22px 48px; }
</style>
</head>
<body>
  <div class="card {{TEMPLATE_CLASS}}" data-template="{{TEMPLATE_ID}}" style="--bg: {{BG}}; {{STYLE}}">
    <div class="title">{{TITLE}}</div>
    <div class="body">
      <div class="text">{{TEXT}}</div>
    </div>
  </div>

  <script>
    (function () {
      function fit() {
        var body = document.querySelector('.body');
        var text = document.querySelector('.text');
        var title = document.querySelector('.title');

        var tmin = 26, tmax = 76, tbest = tmin;
        while (tmin <= tmax) {
          var tm = (tmin + tmax) >> 1;
          title.style.fontSize = tm + 'px';
          if (title.scrollWidth <= title.clientWidth && title.scrollHeight <= title.clientHeight) {
            tbest = tm; tmin = tm + 1;
          } else { tmax = tm - 1; }
        }
        title.style.fontSize = tbest + 'px';

        var bodyStyle = getComputedStyle(body);
        var padY = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
        var availableH = Math.max(1, body.clientHeight - padY - 8);

        text.style.lineHeight = getComputedStyle(text).getPropertyValue('--text-lh') || '1.28';
        var min = 20, max = 58, best = min;
        while (min <= max) {
          var mid = (min + max) >> 1;
          text.style.fontSize = mid + 'px';
          var fitsV = text.scrollHeight <= availableH;
          var fitsH = text.scrollWidth <= text.clientWidth + 2;
          if (fitsV && fitsH) { best = mid; min = mid + 1; }
          else { max = mid - 1; }
        }
        text.style.fontSize = best + 'px';

        window.__fitFontPx = best;
        window.__fitted = true;
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      else fit();
      setTimeout(function () { if (!window.__fitted) fit(); }, 1500);
    })();
  </script>
</body>
</html>
