<!DOCTYPE html>
<!-- RU-дека на фонах russian_jokes/* (сцены со встроенным светлым «листом»: кухня, баня, поезд…).
     Тот же тёмный PT Serif + заголовок с красным акцентом + авто-подгон, что и в
     anecdote.html, но текст лежит в SAFE-зоне «листа» (padding = отступы фона). Лист светлый →
     тёмные чернила без скрима. Текст течёт с реальными переносами (white-space:pre-wrap) — две
     склеенные шутки разделяются пустой строкой + тонким разделителем. -->
<html lang="ru">
<head>
<meta charset="utf-8" />
<style>{{FONT_CSS}}</style>
<style>
  :root {
    --bg: {{BG}};
    --safe-top: {{SAFE_TOP}}px; --safe-right: {{SAFE_RIGHT}}px; --safe-bottom: {{SAFE_BOTTOM}}px; --safe-left: {{SAFE_LEFT}}px;
    --ink: #20160f;
    --accent: #b23b2e;
    --title-size: 52px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  .card {
    width: 1080px; height: 1920px;
    background: var(--bg);
    padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    display: flex; flex-direction: column;
    font-family: 'RU PT Serif', Georgia, 'DejaVu Serif', serif;
    color: var(--ink);
  }

  /* Заголовок: одна строка сверху, на бумажной подложке для контраста на тёмных краях сцены */
  .title-wrap { flex: 0 0 auto; text-align: center; }
  .title {
    display: inline-block; max-width: 100%;
    font-weight: 700; font-size: var(--title-size); line-height: 1.08;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--ink);
    background: rgba(255, 252, 243, .94);
    border: 1px solid rgba(99, 72, 43, .18);
    border-bottom: 5px solid var(--accent);
    border-radius: 2px;
    padding: 5px 22px 10px;
    box-shadow:
      0 4px 14px rgba(36, 24, 14, .15),
      0 0 0 1px rgba(255, 255, 255, .5) inset;
    text-shadow: none;
  }

  /* Тело: авто-вписывание, заполняет лист, не обрезается */
  .body {
    flex: 1 1 auto; display: flex; flex-direction: column;
    align-items: stretch; justify-content: flex-start; overflow: hidden;
    padding: 20px 0 4px;
  }
  .text {
    width: 100%; text-align: left; line-height: 1.34; white-space: pre-wrap;
    font-size: 52px; word-wrap: break-word; overflow-wrap: break-word;
    /* лёгкий светлый ореол: текст читается, даже если край листа граничит с тёмным предметом */
    text-shadow: 0 0 5px rgba(255,255,252,.92), 0 1px 2px rgba(255,255,252,.72);
  }
  /* Тонкий разделитель между двумя склеенными анекдотами (если в тексте есть строка «— — —») */

  /* Низ карточки: только смайл, без подписи/тега канала. */
  .footer { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-start; }
  .emoji { font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; font-size: 60px; line-height: 1; }
</style>
</head>
<body>
  <div class="card">
    <div class="title-wrap"><span class="title">{{TITLE}}</span></div>
    <div class="body"><div class="text">{{TEXT}}</div></div>
    <div class="footer">
      <span class="emoji">😂</span>
    </div>
  </div>

  <script>
    (function () {
      function fit() {
        var body = document.querySelector('.body');
        var text = document.querySelector('.text');
        var titleEl = document.querySelector('.title');
        if (titleEl) {
          var ts = 52;
          titleEl.style.fontSize = ts + 'px';
          while (ts > 30 && titleEl.scrollWidth > titleEl.clientWidth + 1) {
            ts -= 2; titleEl.style.fontSize = ts + 'px';
          }
        }
        var BASE_LH = 1.34;
        text.style.lineHeight = String(BASE_LH);
        var min = 22, max = 60, best = min;
        var bodyStyle = getComputedStyle(body);
        var bodyContentHeight =
          body.clientHeight -
          parseFloat(bodyStyle.paddingTop || '0') -
          parseFloat(bodyStyle.paddingBottom || '0');
        while (min <= max) {
          var mid = (min + max) >> 1;
          text.style.fontSize = mid + 'px';
          var fitsV = text.scrollHeight <= bodyContentHeight;
          var fitsH = text.scrollWidth <= text.clientWidth + 2;
          if (fitsV && fitsH) { best = mid; min = mid + 1; }
          else { max = mid - 1; }
        }
        text.style.fontSize = best + 'px';
        text.style.lineHeight = String(BASE_LH);
        window.__fitOverflow =
          text.scrollHeight > bodyContentHeight + 1 ||
          text.scrollWidth > text.clientWidth + 2;
        window.__fitFontPx = best;
        window.__fitted = true;
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      else fit();
      setTimeout(function () { if (!window.__fitted) fit(); }, 1500);
    })();
  </script>
</body>
</html>
