<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --banner: {{BANNER}};
    --cream: #fbf4e0;
    --ink: #15130f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #f6c9d6 0%, #cdeccf 45%, #cfe6f7 100%);
    padding: 12px;
    font-family: 'Montserrat', 'DejaVu Sans', sans-serif;
    color: var(--ink);
  }
  .card {
    width: 100%; height: 100%;
    background: var(--cream);
    border: 7px solid #000;
    border-radius: 22px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* Header: category chip (left) + title (right) on a coloured banner */
  .header {
    flex: 0 0 auto;
    background: var(--banner);
    border-bottom: 7px solid #000;
    display: flex; align-items: center; gap: 24px;
    padding: 30px 44px;
    min-height: 150px;
  }
  .chip {
    flex: 0 0 auto;
    background: #fff; color: #000;
    border: 4px solid #000; border-radius: 10px;
    font-weight: 800; font-size: 26px; letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 18px; white-space: nowrap;
  }
  .title {
    flex: 1 1 auto; text-align: right;
    font-weight: 900; font-size: 62px; line-height: 1.05;
    white-space: nowrap; overflow: hidden;
  }
  /* Stage: the puzzle image, framed with a white mat */
  .stage {
    flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 60px 60px;
    min-height: 0;
  }
  .frame {
    background: #fff; border: 5px solid #000;
    padding: 26px;
    max-width: 100%; max-height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .frame img {
    max-width: 100%; max-height: 100%;
    display: block; object-fit: contain;
  }
  /* Footer: question + CTA */
  .footer {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
    padding: 20px 60px 60px;
  }
  .question { text-align: center; font-weight: 800; font-size: 54px; line-height: 1.18; }
  .cta {
    background: #15130f; color: #fff;
    font-weight: 700; font-size: 34px;
    padding: 20px 40px; border-radius: 14px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="chip">{{CATEGORY}}</span>
      <span class="title" id="title">{{TITLE}}</span>
    </div>
    <div class="stage">
      <div class="frame"><img id="img" src="{{IMAGE}}" /></div>
    </div>
    <div class="footer">
      <div class="question" id="question">{{QUESTION}}</div>
      <div class="cta">{{CTA}}</div>
    </div>
  </div>
  <script>
    (function () {
      function fit() {
        // Title: shrink to a single line down to a floor.
        var t = document.getElementById('title');
        if (t) {
          var ts = 62; t.style.fontSize = ts + 'px';
          while (ts > 32 && t.scrollWidth > t.clientWidth + 1) { ts -= 2; t.style.fontSize = ts + 'px'; }
        }
        // Question: shrink so it stays at most ~3 lines.
        var q = document.getElementById('question');
        if (q) {
          var qs = 54; q.style.fontSize = qs + 'px';
          while (qs > 30 && q.scrollHeight > 210) { qs -= 2; q.style.fontSize = qs + 'px'; }
        }
        window.__fitted = true;
      }
      var img = document.getElementById('img');
      function go() { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); else fit(); }
      if (img && !img.complete) { img.addEventListener('load', go); img.addEventListener('error', go); }
      else go();
      setTimeout(function () { if (!window.__fitted) fit(); }, 1800);
    })();
  </script>
</body>
</html>
