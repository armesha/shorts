<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE_PLAIN}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Linden+Hill:ital@0;1&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Kolker+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFF7; --ink:#111111; --brush:#FF4B4B;
    --t-padx:65px; --t-top:61px; --t-bot:1623px; --title-size:80px;
    --b-padx:67px; --b-top:316px; --b-bot:180px;
    --body-size:49px; --body-line:1.27; --item-gap:28px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d9d9d4;}
  body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px;font-family:"Lora",Georgia,serif;}
  .stage{transform-origin:top left;}
  .canvas{position:relative;width:1080px;height:1920px;background:var(--bg);overflow:hidden;}

  .box-title{position:absolute;left:var(--t-padx);right:var(--t-padx);top:var(--t-top);bottom:var(--t-bot);
    overflow:visible;display:flex;align-items:center;justify-content:center;}
  .box-text{position:absolute;left:var(--b-padx);right:var(--b-padx);top:var(--b-top);bottom:var(--b-bot);overflow:hidden;}

  .title-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;}
  .brush{position:absolute;inset:-22px -48px;width:calc(100% + 96px);height:calc(100% + 44px);z-index:0;}
  .title{position:relative;z-index:1;font-family:"Linden Hill","Playfair Display",serif;font-weight:400;font-size:var(--title-size);
    letter-spacing:.5px;color:#1a1a1a;text-align:center;line-height:1.05;padding:0 16px;}

  .list{list-style:none;}
  .list li{font-family:"Lora",Georgia,serif;font-size:var(--body-size);line-height:var(--body-line);
    color:var(--ink);margin-bottom:var(--item-gap);}
  .list li:last-child{margin-bottom:0;}
  .list li .m{font-weight:600;}

  /* ---- паттерны ---- */
  .list.numbered_tight li{margin-bottom:calc(var(--item-gap)*.6);}
  .list.bullet li::before, .list.premium li::before{content:"•  ";color:var(--brush);font-weight:700;}
  .list.bullet_color li .m{font-weight:700;color:#B5532A;}
  .list.term li .term{font-weight:400;color:#333;}
  .list.term li .m{font-weight:700;}
  .list.myth li .pair{display:block;}
  .list.myth li .m{font-weight:700;}
  .list.quote li{font-style:italic;}
  .list.quote li .m{font-style:normal;font-weight:600;}
  .list.quote li .auth{font-style:italic;color:#555;font-weight:600;}
  .list.premium li{font-size:calc(var(--body-size)*1.04);}

  /* призыв к действию — приглушённо отделён */
  .outro{margin-top:calc(var(--item-gap)*1.9);padding-top:calc(var(--item-gap)*1.1);
    border-top:2px solid rgba(0,0,0,.18);text-align:center;text-indent:0;}
  .outro::before{content:none !important;}
  .outro .m{font-style:italic;font-weight:600;color:#555;}

  .watermark{position:absolute;right:60px;bottom:70px;display:flex;align-items:center;gap:14px;color:#2a2a2a;z-index:6;}
  .watermark .sig{font-family:"Kolker Brush",cursive;font-size:52px;line-height:1;transform:rotate(-4deg);}
  .watermark .dot{width:26px;height:26px;position:relative;}
  .watermark .dot::before{content:"";position:absolute;left:0;top:8px;width:18px;height:6px;border-radius:50%;background:#111;transform:rotate(18deg);}
  .watermark .dot::after{content:"";position:absolute;right:0;top:2px;width:8px;height:8px;border-radius:50%;background:#111;}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="canvas">
      <div class="box-title" id="boxTitle">
        <div class="title-wrap">

          </svg>
          <h1 class="title" id="title">{{TITLE}}</h1>
        </div>
      </div>
      <div class="box-text" id="boxText">
        <ul class="list {{PATTERN}}">{{ITEMS}}</ul>
      </div>
      <div class="watermark"><span class="sig">Notizen eines Psychologen</span><span class="dot"></span></div>
    </div>
  </div>
<script>
  const root=document.documentElement, boxTitle=document.getElementById('boxTitle'),
        boxText=document.getElementById('boxText'), titleEl=document.getElementById('title');
  function fitTitle(){
    let s=80; titleEl.style.fontSize=s+'px';
    while(s>34 && (titleEl.scrollWidth>boxTitle.clientWidth || titleEl.scrollHeight>boxTitle.clientHeight)){
      s-=1; titleEl.style.fontSize=s+'px';}
    root.style.setProperty('--title-size',s+'px');
  }
  function fitText(){
    let s=49, g=28;
    root.style.setProperty('--body-size',s+'px'); root.style.setProperty('--item-gap',g+'px');
    let guard=0;
    while(boxText.scrollHeight>boxText.clientHeight && guard<800){
      if(s>22){s-=1;root.style.setProperty('--body-size',s+'px');}
      else if(g>4){g-=1;root.style.setProperty('--item-gap',g+'px');}
      else break; guard++;}
    while(s<66 && boxText.scrollHeight<=boxText.clientHeight){
      s+=1;root.style.setProperty('--body-size',s+'px');
      if(boxText.scrollHeight>boxText.clientHeight){s-=1;root.style.setProperty('--body-size',s+'px');break;}}
    window.__fitFontPx=s; window.__fitted=true;
  }
  function run(){fitTitle();fitText();}
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(run);} else run();
  setTimeout(function(){ if(!window.__fitted) run(); },1500);
</script>
</body>
</html>
