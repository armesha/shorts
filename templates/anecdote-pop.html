<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Noto+Serif+Devanagari:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Naskh+Arabic:wght@700&family=Nunito:wght@700;900&family=Montserrat:wght@700;900&family=Noto+Color+Emoji&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ff8a00;
    --bg2: #ffb000;
    --panel: #fffaf1;
    --panel2: #ffffff;
    --ink: #101010;
    --muted: rgba(16,16,16,.56);
    --accent: #111111;
    --accent2: #ffcf2e;
    --radius: 30px;
    --title-font: 'Nunito', 'Montserrat', 'Noto Sans Devanagari', 'Noto Naskh Arabic', system-ui, sans-serif;
    --body-font: 'Nunito', 'Montserrat', 'Noto Serif Devanagari', 'Noto Naskh Arabic', system-ui, sans-serif;
    --title-size: 58px;
    --body-size: 58px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: transparent; }
  .card {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    padding: 74px 70px 72px;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 12%, rgba(255,255,255,.32), transparent 22%),
      radial-gradient(circle at 92% 88%, rgba(255,255,255,.28), transparent 24%),
      linear-gradient(160deg, var(--bg), var(--bg2));
    font-family: var(--body-font);
  }
  .card::before,
  .card::after {
    content: "";
    position: absolute;
    pointer-events: none;
    border-radius: 999px;
    opacity: .26;
  }
  .card::before {
    width: 340px;
    height: 340px;
    right: -92px;
    top: -86px;
    border: 38px solid rgba(255,255,255,.72);
  }
  .card::after {
    width: 260px;
    height: 260px;
    left: -100px;
    bottom: 210px;
    background: rgba(255,255,255,.46);
  }
  .panel {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: var(--radius);
    padding: 56px 62px 42px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.48)),
      linear-gradient(180deg, var(--panel), var(--panel2));
    box-shadow: 0 22px 54px rgba(0,0,0,.18);
  }
  .art {
    flex: 0 0 auto;
    min-height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 22px;
    color: var(--accent);
    font-family: 'Noto Color Emoji', var(--title-font);
    font-size: 76px;
    line-height: 1;
  }
  .art .doodle {
    font-family: var(--title-font);
    font-size: 42px;
    font-weight: 900;
    color: var(--accent);
    border: 5px solid currentColor;
    border-radius: 999px;
    padding: 12px 24px;
    transform: rotate(-3deg);
  }
  .title {
    flex: 0 0 auto;
    direction: {{DIR}};
    unicode-bidi: plaintext;
    text-align: center;
    font-family: var(--title-font);
    font-size: var(--title-size);
    line-height: 1.08;
    font-weight: 900;
    color: var(--accent);
    margin: 0 auto 24px;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .body {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 0 0;
  }
  .text {
    width: 100%;
    direction: {{DIR}};
    unicode-bidi: plaintext;
    text-align: {{TEXT_ALIGN}};
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: var(--body-font);
    font-weight: 900;
    font-size: var(--body-size);
    line-height: 1.22;
    color: var(--ink);
  }
  .footer {
    flex: 0 0 auto;
    min-height: 112px;
    display: flex;
    align-items: end;
    justify-content: flex-start;
    gap: 24px;
    padding-top: 10px;
  }
  .emoji {
    font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    font-size: 122px;
    line-height: 1;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.18));
  }
  .dense .art { display: none; }
  .dense .panel { padding: 38px 52px 32px; }
  .dense .title { margin-bottom: 12px; }
  .dense .body { padding-top: 0; }
  .dense .footer { display: none; min-height: 0; padding-top: 0; }
  .dense .emoji { font-size: 72px; }

  .v-orange-card { --bg:#ff8800; --bg2:#ff9f1c; --panel:#fffdf8; --panel2:#ffffff; --accent:#101010; --accent2:#ffe066; --radius:28px; }
  .v-orange-card .panel { border: 0; }

  .v-lemon-blob { --bg:#fff1a8; --bg2:#ffe05c; --panel:#ffd900; --panel2:#ffeb4a; --accent:#111; --radius:96px; }
  .v-lemon-blob .panel { box-shadow: inset 0 0 0 10px rgba(255,255,255,.76), 0 20px 46px rgba(0,0,0,.12); }

  .v-yellow-doodle { --bg:#ffdf5b; --bg2:#ffd33d; --panel:#ffdf5b; --panel2:#ffdf5b; --accent:#050505; --radius:12px; }
  .v-yellow-doodle .panel { box-shadow: none; border: 0; padding-left: 52px; padding-right: 52px; }
  .v-yellow-doodle .title { text-transform: uppercase; }

  .v-blue-note { --bg:#1b75bb; --bg2:#42c6ff; --panel:#f5fbff; --panel2:#ffffff; --accent:#0b3f6f; --accent2:#ffcf2e; --radius:22px; }
  .v-blue-note .panel { border-left: 18px solid var(--accent2); }

  .v-mint-chat { --bg:#0f9f8f; --bg2:#95f0cf; --panel:#f3fff8; --panel2:#ffffff; --accent:#075c52; --accent2:#ff6f59; --radius:44px; }
  .v-mint-chat .panel { border-bottom-right-radius: 120px; }

  .v-rose-ticket { --bg:#ff4f7b; --bg2:#ffc0cb; --panel:#fff4f7; --panel2:#ffffff; --accent:#7c1230; --accent2:#111111; --radius:18px; }
  .v-rose-ticket .panel { border: 7px dashed rgba(124,18,48,.55); }

  .v-purple-stage { --bg:#4b2bbf; --bg2:#d46cff; --panel:#fbf7ff; --panel2:#ffffff; --accent:#341487; --accent2:#ffe166; --radius:34px; }
  .v-purple-stage .title { color: #fff; background: var(--accent); border-radius: 18px; padding: 12px 24px; }

  .v-green-board { --bg:#114b3b; --bg2:#2c7a5e; --panel:#f6f3e9; --panel2:#ffffff; --accent:#114b3b; --accent2:#ffcf2e; --radius:16px; }
  .v-green-board .panel { border: 12px solid #114b3b; }

  .v-kraft-sticky { --bg:#c98239; --bg2:#f1c27d; --panel:#fff0bd; --panel2:#fff8dc; --accent:#5f3514; --accent2:#e4572e; --radius:8px; }
  .v-kraft-sticky .panel { transform: rotate(-1deg); box-shadow: 0 24px 48px rgba(64,38,13,.22); }

  .v-comic-red { --bg:#e63946; --bg2:#ff9f1c; --panel:#fffdf5; --panel2:#fff4d6; --accent:#111; --accent2:#e63946; --radius:26px; }
  .v-comic-red .panel { border: 8px solid #111; }
  .v-comic-red .title { text-transform: uppercase; }

  .v-cyan-phone { --bg:#00b4d8; --bg2:#90e0ef; --panel:#ffffff; --panel2:#eefcff; --accent:#023e8a; --accent2:#ffb703; --radius:54px; }
  .v-cyan-phone .panel { border: 14px solid #023e8a; }

  .v-peach-sticky { --bg:#ffb085; --bg2:#ffd6a5; --panel:#fff7ed; --panel2:#ffffff; --accent:#713f12; --accent2:#fb7185; --radius:24px; }
  .v-peach-sticky .art .doodle { border-radius: 12px; transform: rotate(2deg); }

  .v-graphite { --bg:#202124; --bg2:#424242; --panel:#fff8df; --panel2:#fffef5; --accent:#151515; --accent2:#ffcf2e; --radius:20px; }
  .v-graphite .panel { box-shadow: 0 22px 54px rgba(0,0,0,.36); }

  .v-notebook { --bg:#e0f2fe; --bg2:#bae6fd; --panel:#ffffff; --panel2:#f8fbff; --accent:#1d4ed8; --accent2:#ef4444; --radius:6px; }
  .v-notebook .panel {
    background:
      repeating-linear-gradient(180deg, transparent 0, transparent 67px, rgba(29,78,216,.14) 68px, transparent 69px),
      linear-gradient(180deg, var(--panel), var(--panel2));
    border-left: 11px solid #ef4444;
  }

  .v-confetti { --bg:#fef3c7; --bg2:#fde68a; --panel:#ffffff; --panel2:#fffaf0; --accent:#111827; --accent2:#16a34a; --radius:36px; }
  .v-confetti::before { border-color: rgba(22,163,74,.35); }
  .v-confetti::after { background: rgba(239,68,68,.26); }

  .v-ai-comedy-card {
    --bg:#ff8a00; --bg2:#ffcf3d; --panel:#ffffff; --panel2:#fffdf7; --accent:#111111; --accent2:#00a9d6; --radius:30px;
    background:
      linear-gradient(180deg, rgba(255,138,0,.12), rgba(255,138,0,.10)),
      url("{{AI_BG}}") center/cover no-repeat;
  }
  .v-ai-comedy-card::before,
  .v-ai-comedy-card::after { display: none; }
  .v-ai-comedy-card .panel {
    margin-top: 34px;
    height: calc(100% - 68px);
    background: rgba(255,255,255,.86);
    border: 6px solid rgba(17,17,17,.18);
    box-shadow: 0 20px 52px rgba(0,0,0,.12);
  }

  .v-paper-desk { --bg:#f1e2c8; --bg2:#fff7e8; --panel:#fffdf6; --panel2:#fff8ea; --accent:#3f2a16; --accent2:#0f766e; --radius:18px; }
  .v-paper-desk .panel {
    border: 8px solid rgba(63,42,22,.22);
    box-shadow: 0 24px 54px rgba(70,43,18,.20);
  }
  .v-paper-desk .art .doodle { background: #fff3c4; }

  .v-dark-punchline { --bg:#111827; --bg2:#334155; --panel:#fff7db; --panel2:#ffffff; --accent:#111827; --accent2:#f59e0b; --radius:24px; }
  .v-dark-punchline .panel { border: 10px solid #f59e0b; box-shadow: 0 28px 70px rgba(0,0,0,.34); }
  .v-dark-punchline .title { background:#111827; color:#fff7db; border-radius:18px; padding:14px 22px; }

  .v-sticker-board { --bg:#8b5cf6; --bg2:#22d3ee; --panel:#ffffff; --panel2:#f8fbff; --accent:#1f2937; --accent2:#facc15; --radius:46px; }
  .v-sticker-board .panel {
    border: 7px solid #1f2937;
    box-shadow: 0 24px 56px rgba(31,41,55,.25);
  }
  .v-sticker-board .art .doodle { background:#facc15; transform: rotate(4deg); }

  .v-speech-bubble { --bg:#38bdf8; --bg2:#f0f9ff; --panel:#ffffff; --panel2:#ffffff; --accent:#0f172a; --accent2:#fb7185; --radius:64px; }
  .v-speech-bubble .panel {
    border-bottom-left-radius: 150px;
    border: 8px solid rgba(15,23,42,.16);
    box-shadow: 0 22px 52px rgba(14,116,144,.18);
  }
  .v-speech-bubble .footer { justify-content: flex-end; }

  .animated-gif-template .panel {
    padding-bottom: 34px;
  }
  .animated-gif-template .art,
  .animated-gif-template .emoji {
    display: none;
  }
  .animated-gif-template .footer {
    min-height: 208px;
  }
  .animated-gif-template.dense .footer {
    min-height: 150px;
  }

  .v-gif-joy-note { --bg:#f97316; --bg2:#facc15; --panel:#fffaf0; --panel2:#ffffff; --accent:#7c2d12; --accent2:#0f766e; --radius:26px; }
  .v-gif-joy-note .panel { border: 8px solid rgba(124,45,18,.18); }

  .v-gif-rofl-pop { --bg:#06b6d4; --bg2:#f0f9ff; --panel:#ffffff; --panel2:#ecfeff; --accent:#164e63; --accent2:#f59e0b; --radius:42px; }
  .v-gif-rofl-pop .panel { border-bottom-left-radius: 138px; }

  .v-gif-laughing-ticket { --bg:#ef4444; --bg2:#fb7185; --panel:#fff7ed; --panel2:#ffffff; --accent:#7f1d1d; --accent2:#111827; --radius:18px; }
  .v-gif-laughing-ticket .panel { border: 7px dashed rgba(127,29,29,.48); }

  .v-gif-mind-blown { --bg:#312e81; --bg2:#a78bfa; --panel:#faf5ff; --panel2:#ffffff; --accent:#2e1065; --accent2:#facc15; --radius:30px; }
  .v-gif-mind-blown .title { background:#2e1065; color:#fff7ed; border-radius:18px; padding:12px 20px; }

  .v-gif-star-struck { --bg:#0f766e; --bg2:#99f6e4; --panel:#f8fffb; --panel2:#ffffff; --accent:#064e3b; --accent2:#f59e0b; --radius:34px; }
  .v-gif-star-struck .panel { box-shadow: inset 0 0 0 8px rgba(15,118,110,.14), 0 22px 54px rgba(0,0,0,.16); }

  .v-gif-fire-punchline { --bg:#111827; --bg2:#4b5563; --panel:#fff7db; --panel2:#ffffff; --accent:#111827; --accent2:#f97316; --radius:20px; }
  .v-gif-fire-punchline .panel { border: 10px solid #f97316; }

  .v-gif-party-face { --bg:#7c3aed; --bg2:#22d3ee; --panel:#ffffff; --panel2:#fdf4ff; --accent:#3b0764; --accent2:#fde047; --radius:44px; }
  .v-gif-party-face .art .doodle { transform: rotate(4deg); background:#fde047; }

  .v-gif-clap-card { --bg:#15803d; --bg2:#86efac; --panel:#f7fee7; --panel2:#ffffff; --accent:#14532d; --accent2:#f97316; --radius:14px; }
  .v-gif-clap-card .panel { border-left: 18px solid #14532d; }

  .v-gif-thumbs-up { --bg:#2563eb; --bg2:#93c5fd; --panel:#ffffff; --panel2:#eff6ff; --accent:#1e3a8a; --accent2:#facc15; --radius:54px; }
  .v-gif-thumbs-up .panel { border: 12px solid rgba(30,58,138,.20); }

  .v-gif-sparkles { --bg:#fef3c7; --bg2:#fde68a; --panel:#ffffff; --panel2:#fff7ed; --accent:#78350f; --accent2:#10b981; --radius:32px; }
  .v-gif-sparkles::before { border-color: rgba(16,185,129,.34); }

  .motion-overlay {
    background: transparent !important;
    padding: 116px 84px 108px;
  }
  .motion-overlay::before,
  .motion-overlay::after {
    display: none !important;
  }
  .motion-overlay .panel {
    height: 100%;
    border: 7px solid rgba(255,255,255,.38);
    background:
      linear-gradient(180deg, rgba(255,255,255,.91), rgba(255,255,255,.78)),
      linear-gradient(180deg, var(--panel), var(--panel2));
    box-shadow:
      0 30px 90px rgba(0,0,0,.42),
      inset 0 0 0 2px rgba(255,255,255,.28);
  }
  .motion-overlay .art {
    min-height: 84px;
    margin-bottom: 18px;
    font-size: 68px;
  }
  .motion-overlay .art .doodle {
    font-size: 36px;
    padding: 10px 20px;
    background: rgba(255,255,255,.62);
  }
  .motion-overlay .footer {
    min-height: 90px;
  }
  .motion-overlay .emoji {
    font-size: 96px;
  }
  .motion-overlay.dense .panel {
    padding-top: 46px;
  }
  .motion-overlay.dense .footer {
    min-height: 54px;
  }
</style>
</head>
<body>
  <div class="card {{VARIANT}} {{DENSE}} {{ANIMATED}} {{MOTION_OVERLAY}}">
    <main class="panel">
      <div class="art"><span>{{EMOJI}}</span><span class="doodle">{{DOODLE}}</span></div>
      <div class="title">{{TITLE}}</div>
      <section class="body"><div class="text">{{TEXT}}</div></section>
      <footer class="footer">
        <span class="emoji">{{EMOJI}}</span>
      </footer>
    </main>
  </div>

  <script>
    (function () {
      function fit() {
        var body = document.querySelector('.body');
        var text = document.querySelector('.text');
        var titleEl = document.querySelector('.title');
        if (titleEl) {
          var ts = 58;
          titleEl.style.fontSize = ts + 'px';
          while (ts > 30 && titleEl.scrollHeight > 142) {
            ts -= 2;
            titleEl.style.fontSize = ts + 'px';
          }
        }
        var isDense = document.querySelector('.card').classList.contains('dense');
        var min = isDense ? 18 : 24, max = isDense ? 50 : 74, best = min;
        while (min <= max) {
          var mid = (min + max) >> 1;
          text.style.fontSize = mid + 'px';
          text.style.lineHeight = mid <= 34 ? '1.16' : '1.22';
          var fitsV = text.scrollHeight <= body.clientHeight;
          var fitsH = text.scrollWidth <= text.clientWidth + 2;
          if (fitsV && fitsH) { best = mid; min = mid + 1; }
          else { max = mid - 1; }
        }
        text.style.fontSize = best + 'px';
        var baseLineHeight = best <= 34 ? 1.16 : 1.22;
        text.style.lineHeight = String(baseLineHeight);
        var natural = text.scrollHeight;
        var target = body.clientHeight;
        if (natural > 0 && natural < target * 0.82) {
          text.style.lineHeight = String(Math.min(1.44, baseLineHeight * (target * 0.86 / natural)));
        }
        window.__fitOverflow = text.scrollHeight > body.clientHeight + 1 || text.scrollWidth > text.clientWidth + 2;
        window.__fitFontPx = best;
        window.__fitted = true;
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      else fit();
      setTimeout(function () { if (!window.__fitted) fit(); }, 1500);
    })();
  </script>
</body>
</html>
