<!doctype html>
<!-- NOTE: do NOT put dir="rtl" on <html> — in headless Chrome 149 it blanks ALL text paint
     (black frame). RTL is done with CSS `direction:rtl` on the text elements instead; Arabic
     bidi orders correctly either way. Fonts: SYSTEM Noto Naskh Arabic (no web font needed). -->
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:{{BG}};
    --safe-top:{{SAFE_TOP}}px; --safe-right:{{SAFE_RIGHT}}px; --safe-bottom:{{SAFE_BOTTOM}}px; --safe-left:{{SAFE_LEFT}}px;
    --verse:80px; --ref:40px; --line:1.72; --gap:34px;
    --cream:#f7ecd2; --gold:#e6c789;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}
  /* Mirror the proven anecdote structure: one sized box, bg on it, no absolute layers / transforms. */
  .card{position:relative;width:1080px;height:1920px;background:var(--bg);
    padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    font-family:"Noto Naskh Arabic","Noto Sans Arabic",serif;}
  /* legibility scrim behind the text zone — pseudo-element = same paint layer (no transform). */
  .card::before{content:"";position:absolute;
    top:calc(var(--safe-top) - 120px);left:calc(var(--safe-left) - 120px);
    right:calc(var(--safe-right) - 120px);bottom:calc(var(--safe-bottom) - 120px);
    background:radial-gradient(ellipse at center, rgba(0,0,0,.62) 0%, rgba(0,0,0,.34) 52%, rgba(0,0,0,0) 78%);}
  .frame{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .col{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap);text-align:center;
    padding:30px 38px 36px;border-radius:44px;
    background:linear-gradient(180deg,rgba(5,4,3,.58),rgba(5,4,3,.36));
    border:1px solid rgba(230,199,137,.18);
    box-shadow:0 18px 56px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.06);}
  .ornament{color:var(--gold);font-size:42px;line-height:1;opacity:.9;text-shadow:0 2px 10px rgba(0,0,0,.7);}
  .verse{width:100%;direction:rtl;text-align:center;font-weight:400;
    font-size:var(--verse);line-height:var(--line);color:var(--cream);
    text-shadow:0 2px 16px rgba(0,0,0,.72), 0 0 3px rgba(0,0,0,.6);
    word-wrap:break-word;overflow-wrap:break-word;text-wrap:balance;}
  .ref{direction:rtl;font-weight:700;color:var(--gold);font-size:var(--ref);letter-spacing:.3px;
    text-shadow:0 2px 10px rgba(0,0,0,.85);
    border-top:1px solid rgba(230,199,137,.45);padding-top:18px;margin-top:4px;max-width:92%;}
</style>
</head>
<body>
  <div class="card">
    <div class="frame" id="frame">
      <div class="col" id="col">
        <div class="ornament">۞</div>
        <div class="verse {{TYPE}}" id="verse">{{ARABIC}}</div>
        <div class="ref" id="ref">{{REF}}</div>
      </div>
    </div>
  </div>
<script>
  var root=document.documentElement,
      frame=document.getElementById('frame'),
      col=document.getElementById('col'),
      verse=document.getElementById('verse');
  function fits(){
    return col.scrollHeight <= frame.clientHeight + 1
        && verse.scrollWidth <= verse.clientWidth + 1;
  }
  function setV(s){
    root.style.setProperty('--verse', s+'px');
    root.style.setProperty('--ref', Math.max(26, Math.min(48, Math.round(s*0.44)))+'px');
  }
  function fit(){
    var s=36; setV(s); var g=0;
    while(s<175 && g++<700){ setV(s+2); if(fits()) s+=2; else { setV(s); break; } }
    g=0; while(!fits() && s>20 && g++<700){ s-=2; setV(s); }
    window.__fitFontPx=s; window.__fitted=true;
  }
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);} else fit();
  setTimeout(function(){ if(!window.__fitted) fit(); }, 1800);
</script>
</body>
</html>
