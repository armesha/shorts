<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=PT+Sans:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #20242b;
    --muted: #4a515c;
    --a: #d64525;   /* левый вариант */
    --b: #1f7a8c;   /* правый вариант */
    --paper: #f6f3ec;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  .stage {
    position: relative;
    width: 1080px; height: 1920px;
    background:
      radial-gradient(120% 80% at 50% 18%, #fffdf8 0%, var(--paper) 55%, #ece7db 100%);
    font-family: 'PT Sans', system-ui, sans-serif;
    color: var(--ink);
  }
  /* SAFE BOX: left 70, width 880 -> right edge 950 (<=960). Top 120; content ends well above y=1520. */
  .safe { position: absolute; left: 70px; top: 120px; width: 880px; }

  .q {
    width: 880px; height: 250px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; overflow: hidden;
    font-family: 'Oswald', sans-serif; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    line-height: 1.08; font-size: 64px;
  }
  .rule { width: 240px; height: 7px; margin: 14px auto 0;
    border-radius: 7px; background: linear-gradient(90deg, var(--a), var(--b)); }

  .cta {
    margin: 18px auto 6px; text-align: center;
    font-weight: 700; font-size: 34px; color: var(--muted);
  }
  .cta .em { font-family: 'Noto Color Emoji', sans-serif; }

  .row { position: relative; margin-top: 22px;
    display: flex; justify-content: space-between; align-items: flex-start; }
  .opt { width: 410px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .photo {
    width: 410px; height: 410px; border-radius: 26px;
    background-color: #ddd; background-size: cover; background-position: center;
    border: 7px solid #ffffff;
    box-shadow: 0 14px 34px rgba(0,0,0,0.20);
  }
  .opt.left  .photo { outline: 4px solid var(--a); outline-offset: -7px; }
  .opt.right .photo { outline: 4px solid var(--b); outline-offset: -7px; }

  .label {
    width: 410px; margin-top: 20px; overflow: hidden;
    font-family: 'Oswald', sans-serif; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    line-height: 1.0; font-size: 44px; white-space: nowrap;
  }
  .opt.left  .label { color: var(--a); }
  .opt.right .label { color: var(--b); }

  .desc {
    width: 410px; height: 300px; margin-top: 14px; overflow: hidden;
    font-size: 38px; line-height: 1.32; color: var(--ink);
  }

  /* ИЛИ-пилюля по центру между фото */
  .vs {
    position: absolute; left: 50%; top: 138px; transform: translateX(-50%);
    width: 110px; height: 110px; border-radius: 50%;
    background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 38px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.28); border: 5px solid #fff;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="safe">
      <div class="q">{{Q}}</div>
      <div class="rule"></div>
      <div class="cta">А ты что выберешь? <span class="em">👇</span></div>
      <div class="row">
        <div class="opt left">
          <div class="photo" style="background-image:url('{{A_IMG}}')"></div>
          <div class="label">{{A_LABEL}}</div>
          <div class="desc">{{A_DESC}}</div>
        </div>
        <div class="vs">ИЛИ</div>
        <div class="opt right">
          <div class="photo" style="background-image:url('{{B_IMG}}')"></div>
          <div class="label">{{B_LABEL}}</div>
          <div class="desc">{{B_DESC}}</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      function run() {
        // Вопрос: ужать до своей рамки (высота 250), не обрезая.
        var q = document.querySelector('.q');
        if (q) {
          var s = 64; q.style.fontSize = s + 'px';
          while (s > 32 && (q.scrollHeight > q.clientHeight || q.scrollWidth > q.clientWidth + 1)) {
            s -= 1; q.style.fontSize = s + 'px';
          }
        }
        // Подписи: одна строка, ужать под ширину колонки.
        document.querySelectorAll('.label').forEach(function (l) {
          var s = 44; l.style.fontSize = s + 'px';
          while (s > 24 && l.scrollWidth > l.clientWidth + 1) { s -= 1; l.style.fontSize = s + 'px'; }
        });
        // Описания: общий размер шрифта, влезающий в ОБЕ рамки (300px), без обрезки.
        var descs = [].slice.call(document.querySelectorAll('.desc'));
        function fits(sz) {
          return descs.every(function (d) {
            d.style.fontSize = sz + 'px';
            return d.scrollHeight <= d.clientHeight && d.scrollWidth <= d.clientWidth + 2;
          });
        }
        var ds = 42, min = 22;
        while (ds > min && !fits(ds)) ds -= 1;
        descs.forEach(function (d) { d.style.fontSize = ds + 'px'; });
        window.__fitDescPx = ds;
        window.__fitted = true;
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(run); else run();
      setTimeout(function () { if (!window.__fitted) run(); }, 1500);
    })();
  </script>
</body>
</html>
